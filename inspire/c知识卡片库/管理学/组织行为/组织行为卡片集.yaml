content_type: KN
content_id: "KN-MG-OB-005-v1.0"
title: "组织文化"
subtitle: "看不见的规则，决定了组织的行为"

target_level: "高中及以上"
target_age: [16, 22]
difficulty: 4
competencies: ["CL-1", "EL-3"]
bloom_level: "analyze"

tags: ["管理", "文化", "组织", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "管理学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "组织文化是指组织成员共享的价值观、信念、行为规范和工作方式，它决定了'在我们这里，事情怎么做'。Schein将文化分为三个层次：人工制品（可见的行为和物质）、信奉的价值观（公开宣称的理念）、基本假设（无意识的信念）。"
  explanation: "就像家庭的'家风'：有的家庭鼓励冒险（'试试看'），有的家庭强调谨慎（'安全第一'）。这些看不见的规则塑造了每个家庭成员的行为。"
  analogy: "就像电脑的'操作系统'：你看不到它，但它决定了所有软件（员工行为）怎么运行。同样的软件在不同的操作系统上表现完全不同。"
  
  examples:
    - context: "生活"
      description: "你们班级的'文化'：是竞争型（排名很重要）还是合作型（互相帮助）？这种文化影响每个人的行为。"
    - context: "平台赛事"
      description: "在'组织进化实验室'中，学生需要从零设计组织文化，并观察文化如何影响团队绩效。"
    - context: "现实商业"
      description: "华为'狼性文化'（奋斗、竞争）vs Google'创新文化'（自由、试错）vs 海底捞'服务文化'（以客户为中心）。"
  
  non_examples:
    - misconception: "文化就是墙上的标语"
      correction: "真正的文化体现在'当没人看的时候，人们怎么做'。标语只是人工制品，底层的基本假设才是文化的核心。"
    - misconception: "文化可以快速改变"
      correction: "文化像冰山，改变需要很长时间（3-5年）。快速改变的文化往往是表面的。"

level_adaptations:
  high:
    explanation: "组织文化的诊断工具：OCAI（竞争型、创新型、层级型、市场型）、文化契合度与绩效的关系。"
    example: "在'组织进化实验室'中，设计不同文化类型的组织，比较其绩效差异。"
  university:
    explanation: "文化的形成与演化、并购中的文化整合、跨文化管理、数字时代的文化变迁。"
    example: "分析微软从'内斗文化'到'成长型思维文化'的转型：Satya Nadella做了什么？"

platform_mapping:
  game_modes:
