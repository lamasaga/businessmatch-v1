---
content_type: KN
content_id: "KN-MG-OB-001-v1.0"
title: "领导力类型"
subtitle: "不同的领导者，不同的带兵方式"

target_level: "初中及以上"
target_age: [13, 22]
difficulty: 2
competencies: ["CL-1"]
bloom_level: "understand"

tags: ["管理", "领导力", "团队", "基础概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "管理学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "领导力类型是对不同领导风格和行为的分类，常见的包括：专制型（命令式）、民主型（参与式）、放任型（授权式）、变革型（激励式）、服务型（支持式）。"
  explanation: |
    - 专制型："我说了算"——快速决策，但可能压抑团队创造力
    - 民主型："大家一起讨论"——集思广益，但决策慢
    - 放任型："你们自己决定"——充分授权，但可能缺乏方向
    - 变革型："跟我一起改变世界"——激励愿景，但要求高
    - 服务型："我来支持你"——关注团队需求，但可能被忽视
  analogy: "就像开车：专制型是'我来开，你们坐好'；民主型是'大家商量走哪条路'；放任型是'你们开，我睡觉'；变革型是'我们一起去一个 exciting 的地方'；服务型是'我负责导航和加油，你们专心开'。"
  
  examples:
    - context: "生活"
      description: "小组作业中：有人直接分配任务（专制）、有人让大家讨论分工（民主）、有人什么都不管（放任）。"
    - context: "平台赛事"
      description: "在'回合制策略'的团队赛中，队长的领导风格直接影响团队表现——没有最好的风格，只有最适合情境的风格。"
    - context: "现实商业"
      description: "乔布斯（变革型+专制型混合）、任正非（变革型）、稻盛和夫（服务型）。"
  
  non_examples:
    - misconception: "有一种'最好的'领导力"
      correction: "领导力是情境依赖的。危机中需要专制，创新中需要民主，成熟业务中需要放任。"
    - misconception: "领导力是天生的"
      correction: "领导力可以通过学习和实践培养。关键是了解自己的风格，并在需要时灵活调整。"

level_adaptations:
  middle:
    explanation: "领导者有不同的风格：有的像将军（命令），有的像朋友（商量），有的像教练（支持你）。不同时候需要不同的风格。"
    example: "在团队活动中，你更倾向于哪种领导风格？你的队友更喜欢哪种风格？"
  high:
    explanation: "情境领导理论：根据任务复杂度和团队成熟度选择领导风格。领导力的自我认知与发展路径。"
    example: "在'组织进化实验室'中，测试不同领导风格对团队绩效的影响。"
  university:
    explanation: "变革型领导vs交易型领导、 Authentic Leadership（真实领导）、分布式领导、领导力与组织文化的关系。"
    example: "分析马斯克的管理风格：为什么他在特斯拉有效，但在Twitter引发争议？"

platform_mapping:
  game_modes:
    - mode_id: "turn_based_strategy_v2"
      application: "团队赛中的领导风格识别与优化"
    - mode_id: "organization_evolution_v1"
      application: "核心机制——设计和测试不同的领导模式"
    - mode_id: "supply_chain_rpg_v1"
      application: "跨团队谈判中的领导风格影响"
  
  ai_tutor_hints:
    - trigger: "团队决策效率极低"
      hint: "你们的讨论很充分，但决策效率很低。民主型领导在创意阶段很好，但在执行阶段可能需要更明确的决策机制。考虑设定'讨论时间上限'和'最终决策者'。"

