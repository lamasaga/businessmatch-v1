content_type: KN
content_id: "KN-MG-OB-003-v1.0"
title: "团队角色理论"
subtitle: "一个完美的团队，需要九种不同的人"

target_level: "初中及以上"
target_age: [13, 22]
difficulty: 3
competencies: ["CL-1", "CL-2"]
bloom_level: "apply"

tags: ["管理", "团队", "角色", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "管理学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "贝尔宾团队角色理论（Belbin Team Roles）识别了9种团队角色：行动导向（推进者、执行者、完成者）、社交导向（协调者、团队工作者、资源调查者）、思维导向（创新者、监控评估者、专家）。一个高效团队需要多种角色的平衡。"
  explanation: "就像足球队：需要前锋（推进者）、中场（协调者）、后卫（监控评估者）、守门员（完成者）。全是前锋的球队赢不了比赛。"
  analogy: "就像做菜：需要有人买菜（资源调查者）、有人切菜（执行者）、有人调味（创新者）、有人尝味道（监控评估者）、有人摆盘（完成者）。如果全是尝味道的，菜永远做不出来。"
  
  examples:
    - context: "生活"
      description: "小组作业中：有人提出创意（创新者）、有人做PPT（执行者）、有人检查错误（监控评估者）、有人上台演讲（推进者）。"
    - context: "平台赛事"
      description: "在'回合制策略'的团队赛中，平台根据学生行为自动识别其团队角色倾向，帮助团队优化分工。"
    - context: "现实商业"
      description: "创业团队的经典组合：技术专家（专家）+ 产品经理（创新者）+ 运营（执行者）+ CEO（协调者/推进者）。"
  
  non_examples:
    - misconception: "一个人只能有一种角色"
      correction: "一个人可以有多个角色倾向，但通常有一两个主导角色。"
    - misconception: "某些角色比其他角色更重要"
      correction: "每个角色都有其价值。缺少任何一种角色，团队都可能失衡。"

level_adaptations:
  middle:
    explanation: "团队需要不同的人：有主意的、有干活的、有检查的、有协调的。如果只有一种人，团队会出问题。"
    example: "在团队活动中，你更像哪种角色？你们团队缺少哪种角色？"
  high:
    explanation: "角色与性格的匹配、角色冲突的管理、虚拟团队中的角色动态、角色随项目阶段的变化。"
    example: "在'组织进化实验室'中，分析不同角色组合的绩效差异。"
  university:
    explanation: "贝尔宾理论的实证研究、Tuckman团队发展阶段（形成-震荡-规范-执行-解散）、团队多样性与绩效的关系。"
    example: "分析为什么'明星团队'（全是大牛）往往表现不如'平衡团队'？"

platform_mapping:
  game_modes:
    - mode_id: "turn_based_strategy_v2"
      application: "团队赛中的角色分配与优化"
    - mode_id: "organization_evolution_v1"
      application: "核心机制——设计团队结构和角色分工"
    - mode_id: "supply_chain_rpg_v1"
      application: "跨团队谈判中的角色互补"
  
  ai_tutor_hints:
    - trigger: "团队角色严重失衡（如全是创新者）"
      hint: "你们团队似乎有很多'出主意'的人，但缺少'把主意变成现实'的人。团队角色理论告诉我们：创意需要执行来落地。考虑调整分工，让一些人专注于执行。"

related_content:
  prerequisites: ["KN-MG-OB-001"]
  extensions: ["KN-MG-OB-004", "KN-MG-OB-005", "KN-MG-OP-001"]
  game_mode_applications: ["turn_based_strategy_v2", "organization_evolution_v1"]

