content_type: KN
content_id: "KN-MG-OB-004-v1.0"
title: "冲突管理"
subtitle: "冲突不一定是坏事，关键看怎么处理"

target_level: "初中及以上"
target_age: [13, 22]
difficulty: 3
competencies: ["CL-4"]
bloom_level: "apply"

tags: ["管理", "冲突", "沟通", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "管理学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "冲突管理是指识别、处理和解决团队或组织内部冲突的过程。冲突分为任务冲突（对事：观点不同）和关系冲突（对人：情感对立）。适度的任务冲突有助于创新，关系冲突则损害团队。"
  explanation: |
    - 任务冲突："我觉得应该走A路线" vs "我觉得B更好"——对事不对人，可以激发创意
    - 关系冲突："你总是不听我的"——对人不对事，破坏信任
    - 管理策略：竞争、合作、妥协、回避、迁就（Thomas-Kilmann模型）
  analogy: "就像火锅：适度的辣（任务冲突）让火锅更香，但辣到吵架（关系冲突）就没人想吃了。好的厨师知道怎么控制火候。"
  
  examples:
    - context: "生活"
      description: "小组作业：有人想做视频（任务冲突），争论后决定做PPT+短视频——这是建设性的。但如果演变成'你总是自作主张'（关系冲突），团队就散了。"
    - context: "平台赛事"
      description: "在'产业链角色扮演'中，上下游的价格谈判必然产生冲突——学会将关系冲突转化为任务冲突是关键。"
    - context: "现实商业"
      description: "乔布斯和乔纳森·艾夫的设计冲突：对产品方向有激烈争论（任务冲突），但彼此尊重（无关系冲突）——催生了iPhone。"
  
  non_examples:
    - misconception: "好团队没有冲突"
      correction: "完全没有冲突的团队可能是在'群体思维'（Groupthink）——为了避免冲突而压制不同意见，反而做出错误决策。"
    - misconception: "冲突管理就是消除冲突"
      correction: "冲突管理是将破坏性冲突转化为建设性冲突，不是消灭所有分歧。"

level_adaptations:
  middle:
    explanation: "冲突有两种：对事的（可以讨论）和对人的（会伤感情）。好的团队善于争论事情，但不攻击人。"
    example: "在团队活动中，练习用'我觉得...因为...'代替'你总是...'。"
  high:
    explanation: "冲突管理策略的选择：根据冲突类型和紧急程度选择竞争、合作、妥协、回避或迁就。"
    example: "在'产业链角色扮演'中，价格谈判中何时应该竞争、何时应该合作？"
  university:
    explanation: "组织冲突的多层次分析（个体-团队-组织-跨组织）、文化差异对冲突管理的影响、数字沟通时代的冲突新特征。"
    example: "分析远程工作如何改变了冲突的动态——更容易回避，也更难修复关系。"

platform_mapping:
  game_modes:
    - mode_id: "supply_chain_rpg_v1"
      application: "核心机制——产业链谈判中的冲突管理"
    - mode_id: "turn_based_strategy_v2"
      application: "团队内部决策冲突的调解"
    - mode_id: "organization_evolution_v1"
      application: "设计冲突管理机制（如轮值CEO、投票规则）"
  
  ai_tutor_hints:
    - trigger: "团队出现关系冲突信号"
      hint: "我注意到你们的讨论从'事情该怎么做'变成了'你这个人怎么样'。冲突管理的第一步是'回归事情'——把对人的不满暂时放一边，先解决事情。"

