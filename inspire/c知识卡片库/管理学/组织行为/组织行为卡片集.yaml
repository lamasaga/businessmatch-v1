content_type: KN
content_id: "KN-MG-OB-002-v1.0"
title: "马斯洛需求层次"
subtitle: "人到底想要什么？"

target_level: "初中及以上"
target_age: [13, 22]
difficulty: 2
competencies: ["CL-1", "EL-2"]
bloom_level: "understand"

tags: ["管理", "动机", "心理", "基础概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "管理学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "马斯洛需求层次理论将人的需求分为五个层次，从低到高：生理需求（食物、水）→安全需求（安全、稳定）→社交需求（归属、友谊）→尊重需求（认可、成就）→自我实现需求（潜能、成长）。"
  explanation: "就像游戏升级：必须先满足低级需求，才能追求高级需求。饿了的人不会想着自我实现，安全受威胁的人不会想着社交。"
  analogy: "就像金字塔：底层是生理和安全（基础），往上是社交和尊重（关系），顶端是自我实现（意义）。地基不稳，上层会塌。"
  
  examples:
    - context: "生活"
      description: "你加入一个社团：先因为有活动场地和零食（生理）→ 然后觉得社团氛围安全（安全）→ 交到朋友（社交）→ 被认可为优秀成员（尊重）→ 通过社团发现了自己的潜能（自我实现）。"
    - context: "平台赛事"
      description: "在'组织进化实验室'中，理解团队成员的需求层次——有的需要明确规则（安全），有的需要认可（尊重），有的需要成长空间（自我实现）。"
    - context: "现实商业"
      description: "谷歌的福利：免费食堂（生理）、稳定雇佣（安全）、团队文化（社交）、晋升通道（尊重）、20%创新时间（自我实现）。"
  
  non_examples:
    - misconception: "必须完全满足低层才能追求高层"
      correction: "需求层次不是严格的阶梯，可以有重叠。艺术家在贫困中（生理未满足）仍追求创作（自我实现）。"
    - misconception: "所有人都以同样的顺序追求需求"
      correction: "文化、个人经历会影响需求优先级。"

level_adaptations:
  middle:
    explanation: "人需要的东西有层次：先吃饱穿暖，再想要安全，然后想交朋友，接着想得到尊重，最后想实现自己的梦想。"
    example: "在团队活动中，为什么有的同学更注重'赢'（尊重），有的更注重'开心'（社交）？"
  high:
    explanation: "马斯洛理论的现代发展：ERG理论（Existence, Relatedness, Growth）、自我决定理论（SDT：自主、胜任、归属）。"
    example: "在'组织进化实验室'中，如何设计激励机制满足不同层次的需求？"
  university:
    explanation: "马斯洛理论的批判与修正、跨文化适用性、需求层次在组织设计中的应用、内在动机与外在激励的平衡。"
    example: "分析为什么'996'文化留不住顶尖人才——过度加班侵犯了低层需求，导致高层需求无法满足。"

platform_mapping:
  game_modes:
    - mode_id: "organization_evolution_v1"
      application: "核心机制——根据团队成员需求设计激励体系"
    - mode_id: "turn_based_strategy_v2"
      application: "团队内部的动机管理和冲突调解"
  
  ai_tutor_hints:
    - trigger: "团队士气低落"
      hint: "团队士气可能和需求层次有关。检查一下：大家的基本需求（规则 clarity、公平感）是否满足了？是否有人需要更多认可或成长空间？"

