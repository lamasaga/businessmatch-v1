content_type: KN
content_id: "KN-BS-MK-003-v1.0"
title: "品牌资产"
subtitle: "为什么同样的T恤，印上logo就贵十倍？"

target_level: "高中及以上"
target_age: [15, 22]
difficulty: 3
competencies: ["ML-3", "ML-5"]
bloom_level: "understand"

tags: ["营销", "品牌", "价值", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "商学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "品牌资产是品牌赋予产品超出其功能价值的额外价值，包括品牌知名度、品牌联想、感知质量、品牌忠诚度等维度。"
  explanation: "同样的白T恤，无牌卖30元，优衣库卖99元，Supreme卖1000元。多出来的价格就是品牌资产——它代表了信任、身份认同、情感连接。"
  analogy: "就像人的 reputation（名声）——两个能力相同的人，名声好的那个更容易获得机会和更高的报酬。"
  
  examples:
    - context: "生活"
      description: "你愿意为'明星同款'多付钱——不是因为功能更好，而是因为品牌带来的社交价值。"
    - context: "平台赛事"
      description: "在'品牌造物坊'中，学生的品牌故事和视觉设计直接影响消费者的品牌感知和溢价能力。"
    - context: "现实商业"
      description: "可口可乐的品牌价值超过其物理资产——即使工厂一夜烧毁，凭品牌就能重建。"
  
  non_examples:
    - misconception: "品牌资产就是logo和广告"
      correction: "品牌资产存在于消费者心智中。没有消费者认知的logo只是一张图。"
    - misconception: "品牌资产只能正向"
      correction: "品牌资产可以为负——负面事件（如食品安全）会摧毁品牌资产。"

level_adaptations:
  high:
    explanation: "品牌资产的四个维度（Aaker模型）：品牌忠诚度、品牌知名度、感知质量、品牌联想（包括专利、渠道等其他资产）。"
    example: "在'回合制策略'中，SHOW投入如何积累品牌资产？品牌资产如何转化为更高的利润率和客户留存？"
  university:
    explanation: "品牌资产的财务估值方法、品牌延伸策略的风险、数字化时代的品牌共创（用户参与品牌建设）。"
    example: "分析李宁的'国潮'品牌重塑：如何通过品牌叙事实现品牌资产的快速提升？"

platform_mapping:
  game_modes:
    - mode_id: "brand_workshop_v1"
      application: "核心机制——学生从零创建品牌，体验品牌资产的积累过程"
    - mode_id: "turn_based_strategy_v2"
      application: "SHOW投入的累积效应——品牌资产如何在多轮中发挥作用"
    - mode_id: "investor_pitch_v1"
      application: "品牌价值是估值的重要组成部分"
  
  ai_tutor_hints:
    - trigger: "学生忽视品牌投入只关注短期销售"
      hint: "你专注于短期销售，但忽视了品牌资产的积累。短期看，品牌投入减少了当期利润；长期看，品牌资产能带来溢价和忠诚度。"

related_content:
  prerequisites: ["KN-BS-MK-002"]
  extensions: ["KN-BS-MK-006", "KN-EC-BE-001"]
  game_mode_applications: ["brand_workshop_v1", "turn_based_strategy_v2"]

