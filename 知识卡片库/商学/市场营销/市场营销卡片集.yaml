# 市场营销知识卡片集（6张）
# ============================================

---
content_type: KN
content_id: "KN-BS-MK-001-v1.0"
title: "STP模型"
subtitle: "不要试图卖给所有人"

target_level: "初中及以上"
target_age: [13, 22]
difficulty: 3
competencies: ["ML-5", "SL-1"]
bloom_level: "apply"

tags: ["营销", "策略", "细分", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "商学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "STP是营销战略的核心框架：Segmentation（市场细分）→ Targeting（目标市场选择）→ Positioning（市场定位）。"
  explanation: |
    - 细分：把大市场切成小群体（按年龄、收入、爱好等）
    - 选择：选1-2个最适合你的群体重点服务
    - 定位：让你的产品在目标群体心中占据独特位置
  analogy: "就像射箭：细分是找到靶子（把一个大靶分成几个小靶），选择是选一个靶瞄准，定位是让你的箭在这个靶上留下独特的印记。"
  
  examples:
    - context: "生活"
      description: "奶茶品牌：喜茶定位年轻潮流群体，蜜雪冰城定位价格敏感学生，茶颜悦色定位国风爱好者。"
    - context: "平台赛事"
      description: "在'回合制策略'中，TECH路线定位技术爱好者，BRAND路线定位时尚追求者——这就是STP。"
    - context: "现实商业"
      description: "特斯拉早期定位'高端环保科技爱好者'，而非'所有买车的人'。"
  
  non_examples:
    - misconception: "STP只是大企业的事"
      correction: "无论多小的企业，资源都是有限的。STP帮助小企业集中火力，避免与大企业正面竞争。"
    - misconception: "定位就是口号"
      correction: "定位是消费者心智中的位置，口号只是表达方式。真正的定位通过产品、价格、渠道、传播一致性来建立。"

level_adaptations:
  middle:
    explanation: "不要想卖给所有人。找到一群最需要你的人，专门为他们设计产品和服务。"
    example: "如果你卖手工饼干，是卖给所有人，还是专门卖给'注重健康的上班族妈妈'？"
  high:
    explanation: "STP的量化工具：市场细分变量（地理、人口、心理、行为）、目标市场评估矩阵（吸引力vs竞争力）。"
    example: "在'产业链角色扮演'中，你的B2B客户也需要STP——你是做高端定制还是大众批发？"
  university:
    explanation: "蓝海战略与STP的结合：不是在同质化市场中竞争，而是通过价值创新创造新的细分市场。"
    example: "拼多多如何通过STP找到被忽视的'下沉市场'？"

platform_mapping:
  game_modes:
    - mode_id: "turn_based_strategy_v2"
      application: "路线选择本质是STP——选择目标群体并建立定位"
    - mode_id: "user_anthropology_v1"
      application: "核心机制——深度理解细分群体的需求和行为"
    - mode_id: "global_trade_v1"
      application: "不同国家的市场细分和定位策略"
  
  ai_tutor_hints:
    - trigger: "学生在所有市场采用同一策略"
      hint: "你似乎在用'一把钥匙开所有锁'。STP告诉我们：不同市场需要不同策略。看看不同城市的消费者特征，也许需要差异化定位。"

