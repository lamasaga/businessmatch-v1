content_type: KN
content_id: "KN-BS-MK-004-v1.0"
title: "消费者决策旅程"
subtitle: "从'不知道'到'买买买'，消费者经历了什么？"

target_level: "高中及以上"
target_age: [15, 22]
difficulty: 3
competencies: ["ML-2", "ML-5"]
bloom_level: "understand"

tags: ["营销", "消费者", "行为", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "商学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "消费者决策旅程描述了消费者从产生需求到最终购买的完整过程，通常包括：认知（Awareness）→兴趣（Interest）→考虑（Consideration）→购买（Purchase）→忠诚（Loyalty）。"
  explanation: "就像追一部剧：先看到预告片（认知）→ 觉得有意思搜评论（兴趣）→ 对比其他剧（考虑）→ 开始追剧（购买）→ 推荐给朋友（忠诚）。"
  analogy: "就像爬山：山脚是'不知道'，山腰是'在比较'，山顶是'决定了'。营销要在不同阶段提供不同的"路标"。"
  
  examples:
    - context: "生活"
      description: "买手机：刷到广告（认知）→ 看测评视频（兴趣）→ 对比三款机型（考虑）→ 下单（购买）→ 一年后推荐给同学（忠诚）。"
    - context: "平台赛事"
      description: "在'用户人类学'中，学生需要深入理解消费者的决策旅程，找到关键影响点。"
    - context: "现实商业"
      description: "奈飞通过数据分析消费者在每个阶段的流失点，优化推荐算法减少'考虑'阶段的犹豫。"
  
  non_examples:
    - misconception: "消费者决策总是理性的"
      correction: "大多数消费决策受到情感、社交、习惯等非理性因素影响。旅程模型也要考虑情感触点。"
    - misconception: "旅程是线性的"
      correction: "现代消费者旅程是环状的、非线性的——可能跳过某些阶段，也可能反复循环。"

level_adaptations:
  high:
    explanation: "AIDA模型（注意-兴趣-欲望-行动）与决策旅程的关系。不同产品类别的旅程差异（高涉入vs低涉入）。"
    example: "在'品牌造物坊'中，如何为新产品设计各阶段的营销策略？"
  university:
    explanation: "消费者决策的多元理论：计划行为理论、技术接受模型、体验经济时代的决策特征。"
    example: "直播电商如何缩短决策旅程？'冲动购买'的心理机制是什么？"

platform_mapping:
  game_modes:
    - mode_id: "user_anthropology_v1"
      application: "核心机制——深度调研消费者在各阶段的需求和痛点"
    - mode_id: "brand_workshop_v1"
      application: "设计品牌传播策略覆盖消费者旅程的每个阶段"
  
  ai_tutor_hints:
    - trigger: "学生只关注'购买'阶段忽视前期培育"
      hint: "你只在'购买'阶段发力，但忽略了消费者的认知和兴趣阶段。品牌需要长期培育——今天的认知是明天的购买。"

related_content:
  prerequisites: ["KN-BS-MK-001"]
  extensions: ["KN-EC-BE-001", "KN-EC-BE-003"]
  game_mode_applications: ["user_anthropology_v1", "brand_workshop_v1"]

