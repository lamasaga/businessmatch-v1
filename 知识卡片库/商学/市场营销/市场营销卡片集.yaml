created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "市场定位是指企业通过在目标消费者心智中建立独特、有价值的差异化形象，使自身产品与竞争对手区别开来。"
  explanation: "定位不是你对产品做什么，而是你对消费者心智做什么。比如：沃尔沃=安全，宝马=驾驶乐趣，奔驰=豪华——同样的车，不同的定位。"
  analogy: "就像班级里的同学：有人是'学霸'，有人是'体育健将'，有人是'社交达人'。每个人都在别人心中有一个'标签'——这就是定位。"
  
  examples:
    - context: "生活"
      description: "在同学眼中，你是'数学很好的人'还是'很会组织活动的人'？这就是你个人品牌的定位。"
    - context: "平台赛事"
      description: "在'品牌造物坊'中，学生需要为自己的品牌选择一个独特的定位，并在所有传播中保持一致。"
    - context: "现实商业"
      description: "瑞幸咖啡的定位：不是'中国星巴克'，而是'年轻人的第一杯咖啡'——完全不同的定位带来不同的策略。"
  
  non_examples:
    - misconception: "定位就是广告语"
      correction: "广告语是定位的表达，但定位是整个企业的战略方向——产品、价格、渠道、服务都要支撑这个定位。"
    - misconception: "定位后不能改变"
      correction: "定位可以调整（ repositioning），但需要时间和资源，且可能有风险（消费者认知惯性）。"

level_adaptations:
  high:
    explanation: "定位三角：消费者需求（Want）、竞争对手空白（Gap）、自身能力（Can）。好的定位是这三者的交集。"
    example: "在'回合制策略'中，如果所有队伍都选TECH，BRAND路线的定位空白就出现了——这就是定位机会。"
  university:
    explanation: "定位理论的演进：Ries & Trout的定位 → Kapferer的品牌身份棱镜 → 数字化时代的实时定位（基于大数据的动态调整）。"
    example: "分析元气森林的'无糖'定位：如何在可口可乐和农夫山泉之间找到空白点？"

platform_mapping:
  game_modes:
    - mode_id: "brand_workshop_v1"
      application: "核心机制——为品牌选择定位并设计支撑策略"
    - mode_id: "turn_based_strategy_v2"
      application: "路线选择即定位——如何在竞争中找到差异化空间"
  
  ai_tutor_hints:
    - trigger: "学生的定位与所有竞争对手相同"
      hint: "你的定位和太多人重叠了。定位的关键是'独特性'——如果所有人都一样，消费者凭什么选你？寻找差异化空间。"

related_content:
  prerequisites: ["KN-BS-MK-001"]
  extensions: ["KN-BS-MK-003", "KN-MG-ST-004"]
  game_mode_applications: ["brand_workshop_v1", "turn_based_strategy_v2"]
