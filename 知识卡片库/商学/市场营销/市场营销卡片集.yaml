---
content_type: KN
content_id: "KN-BS-MK-002-v1.0"
title: "4P营销组合"
subtitle: "营销就是Product、Price、Place、Promotion的组合拳"

target_level: "初中及以上"
target_age: [13, 22]
difficulty: 2
competencies: ["ML-3", "ML-4"]
bloom_level: "apply"

tags: ["营销", "策略", "基础概念", "入门"]
ai_generable: true
author: "平台教研团队"
reviewer: "商学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "4P是营销策略的基本框架：Product（产品）、Price（价格）、Place（渠道）、Promotion（推广）。四个要素相互配合，形成完整的营销方案。"
  explanation: |
    - 产品：你卖什么？有什么特点？
    - 价格：卖多少钱？什么定价策略？
    - 渠道：在哪里卖？线上还是线下？
    - 推广：怎么让人知道？广告、社交媒体？
  analogy: "就像做一道菜：Product是食材，Price是定价，Place是在哪家餐厅卖，Promotion是菜单和宣传。四个都要好，菜才卖得好。"
  
  examples:
    - context: "生活"
      description: "奶茶店的4P：产品（珍珠奶茶）、价格（15元/杯）、渠道（学校门口）、推广（小红书打卡）。"
    - context: "平台赛事"
      description: "在'回合制策略'中，你的4P是：Product（路线选择）、Price（预算分配）、Place（城市选择）、Promotion（Show投入）。"
    - context: "现实商业"
      description: "苹果的4P：高端产品（Product）、溢价定价（Price）、直营店+官网（Place）、极简广告（Promotion）。"
  
  non_examples:
    - misconception: "4P就是营销的全部"
      correction: "4P是经典框架，但现代营销还涉及People、Process、Physical Evidence（服务营销的7P），以及数字化时代的增长黑客。"
    - misconception: "4P是独立的四个决策"
      correction: "4P必须协调一致。高端产品不能配低价，小众产品不能铺大众渠道。"

level_adaptations:
  middle:
    explanation: "卖东西要考虑四个问题：卖什么（产品）、多少钱（价格）、在哪卖（渠道）、怎么让人知道（推广）。"
    example: "为你班级的义卖活动设计4P：产品（手工饼干）、价格（5元/袋）、渠道（操场摊位）、推广（班级群海报）。"
  high:
    explanation: "4P的协同效应和冲突管理。产品生命周期不同阶段的4P策略调整。"
    example: "在'品牌造物坊'中，如何用4P为一个新品牌制定上市策略？"
  university:
    explanation: "从4P到4C（消费者、成本、便利、沟通）的范式转换。数字化时代的营销组合：内容、社群、数据、体验。"
    example: "分析完美日记的4P/4C：为什么能在短时间内挑战国际大牌？"

platform_mapping:
  game_modes:
    - mode_id: "turn_based_strategy_v2"
      application: "4P在赛事中的映射：Product=路线，Price=投入分配，Place=城市，Promotion=Show投入"
    - mode_id: "brand_workshop_v1"
      application: "核心机制——为虚拟品牌设计完整的4P策略"
  
  ai_tutor_hints:
    - trigger: "学生4P要素不协调（如高端定位但低Show投入）"
      hint: "你的定位是高端，但推广投入不足。4P需要协调一致——高端产品需要匹配的品牌传播才能被消费者认知。"

related_content:
  prerequisites: ["KN-EC-MI-001"]
  extensions: ["KN-BS-MK-003", "KN-BS-MK-005"]
  game_mode_applications: ["turn_based_strategy_v2", "brand_workshop_v1"]

