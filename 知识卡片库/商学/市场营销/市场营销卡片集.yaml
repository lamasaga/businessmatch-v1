content_type: KN
content_id: "KN-BS-MK-005-v1.0"
title: "定价策略"
subtitle: "价格不只是数字，是信号"

target_level: "初中及以上"
target_age: [13, 22]
difficulty: 3
competencies: ["ML-4"]
bloom_level: "apply"

tags: ["营销", "定价", "策略", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "商学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "定价策略是企业根据成本、竞争、消费者心理和目标市场等因素，制定产品价格的方法和原则。常见策略包括成本加成、竞争导向、价值导向、撇脂定价、渗透定价等。"
  explanation: |
    - 成本加成：成本+期望利润 = 价格
    - 竞争导向：参考竞争对手定价
    - 价值导向：根据消费者感知的价值定价
    - 撇脂定价：先定高价收割早期用户，再降价
    - 渗透定价：先定低价抢占市场，再提价
  analogy: "就像钓鱼：成本加成是'按鱼饵成本定价'，竞争导向是'看别人钓什么价'，价值导向是'这条鱼对食客值多少钱'。"
  
  examples:
    - context: "生活"
      description: "iPhone新品发布定价高（撇脂），一年后降价（收割完早期用户）。小米手机低价入场（渗透），建立规模后推高端。"
    - context: "平台赛事"
      description: "在'拍卖交易大厅'中，起拍价策略直接影响最终成交价——这是锚定定价的应用。"
    - context: "现实商业"
      description: "Costco的定价策略：所有商品毛利率不超过14%，通过会员费盈利——价值导向的极端形式。"
  
  non_examples:
    - misconception: "定价就是成本+利润"
      correction: "这只是成本加成法，是最基础的定价方式。现代定价更多基于消费者感知价值。"
    - misconception: "低价总是更好"
      correction: "过低的价格可能损害品牌形象，引发价格战，或让消费者质疑质量。"

level_adaptations:
  middle:
    explanation: "定价有三种思路：按成本定、按对手定、按价值定。聪明的定价师会综合考虑。"
    example: "在'定价实验室'中，尝试三种定价方式，看哪种利润最高。"
  high:
    explanation: "心理定价技巧：尾数定价（9.99）、捆绑定价、诱饵定价（加一个明显不划算的选项让目标选项显得合理）。"
    example: "分析星巴克的'中杯陷阱'：如何利用诱饵定价影响消费者选择？"
  university:
    explanation: "动态定价、收益管理、价格歧视（一级/二级/三级）、订阅经济的定价模型。"
    example: "Uber的动态定价算法：如何用价格调节供需？消费者接受度如何？"

platform_mapping:
  game_modes:
    - mode_id: "pricing_lab_v1"
      application: "核心机制——实验不同定价策略的效果"
    - mode_id: "auction_trading_v1"
      application: "拍卖中的价格发现机制和心理定价"
    - mode_id: "turn_based_strategy_v2"
      application: "预算分配中的隐性定价决策"
  
  ai_tutor_hints:
    - trigger: "学生长期采用同一价格不变"
      hint: "你的价格从未调整。现实商业中，定价是动态的——根据竞争、成本、需求变化而调整。试试在不同情境下调整定价策略。"
    - trigger: "学生定价远高于价值感知"
      hint: "你的定价比消费者的感知价值高很多。记住：价格不只是数字，是信号。过高的信号可能是'太贵了，不值得'。"

related_content:
  prerequisites: ["KN-EC-MI-001", "KN-EC-MI-002"]
  extensions: ["KN-EC-BE-001", "KN-BS-MK-003"]
  game_mode_applications: ["pricing_lab_v1", "auction_trading_v1"]

