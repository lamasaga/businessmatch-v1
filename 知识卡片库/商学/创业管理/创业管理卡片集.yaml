content_type: KN
content_id: "KN-BS-EN-003-v1.0"
title: "产品-市场匹配（PMF）"
subtitle: "你的产品，真的有人需要吗？"

target_level: "高中及以上"
target_age: [15, 22]
difficulty: 4
competencies: ["ML-2", "SL-5"]
bloom_level: "evaluate"

tags: ["创业", "市场", "产品", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "商学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "产品-市场匹配（Product-Market Fit）是指产品满足了一个真实、足够大的市场需求的状态。达到PMF的标志：用户主动推荐、留存率高、需求增长自然。"
  explanation: "就像钥匙和锁：你的产品（钥匙）刚好能解决市场（锁）的问题。如果钥匙不对，再漂亮的钥匙也打不开门。"
  analogy: "就像钓鱼：PMF是你找到了鱼多的地方（市场），而且你的鱼饵（产品）正好是鱼爱吃的。鱼竿再贵、技术再好，如果鱼不吃饵，一切都是白费。"
  
  examples:
    - context: "生活"
      description: "你做的手工饰品在同学中很受欢迎，大家都主动来问——这就是PMF的信号。"
    - context: "平台赛事"
      description: "在'创业生存战'中，PMF的信号是：复购率高、口碑传播、不需要大量推广就有订单。"
    - context: "现实商业"
      description: "Zoom的PMF：疫情前就已实现，疫情只是加速器。真正的PMF让用户离不开你。"
  
  non_examples:
    - misconception: "PMF就是销量高"
      correction: "靠大量补贴换来的销量不是PMF。PMF的核心是'有机增长'——用户因为产品本身好而留下来。"
    - misconception: "PMF一旦达到就永远存在"
      correction: "市场会变化，竞争对手会出现。PMF需要持续维护和提升。"

level_adaptations:
  high:
    explanation: "PMF的衡量指标：Sean Ellis测试（40%用户表示'非常失望'如果产品消失）、NPS、留存率曲线、自然增长率。"
    example: "在'创业生存战'中，如何判断你的产品是否达到了PMF？看哪些指标？"
  university:
    explanation: "PMF与商业模式匹配、技术-产品-市场三层匹配框架、PMF的阶段性特征（早期vs成长期）。"
    example: "分析Notion的PMF演进：从个人笔记工具到团队协作平台的匹配扩展。"

platform_mapping:
  game_modes:
    - mode_id: "startup_survival_v1"
      application: "核心目标——在有限轮次内找到PMF"
    - mode_id: "user_anthropology_v1"
      application: "深度调研帮助识别PMF的信号和障碍"
  
  ai_tutor_hints:
    - trigger: "学生靠补贴/低价维持销量"
      hint: "你的销量很大程度上依赖低价补贴。这是PMF的'假阳性'——一旦补贴停止，用户可能流失。真正的PMF是：即使价格正常，用户仍然选择你。"

related_content:
  prerequisites: ["KN-BS-EN-002"]
  extensions: ["KN-BS-MK-001", "KN-BS-MK-004"]
  game_mode_applications: ["startup_survival_v1", "user_anthropology_v1"]

