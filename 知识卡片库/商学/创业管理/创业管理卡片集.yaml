content_type: KN
content_id: "KN-BS-EN-004-v1.0"
title: "融资轮次"
subtitle: "创业公司如何找钱？"

target_level: "高中及以上"
target_age: [16, 22]
difficulty: 4
competencies: ["FL-5"]
bloom_level: "understand"

tags: ["创业", "融资", "投资", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "商学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "融资轮次是创业公司在不同发展阶段向投资者募集资金的标准化流程，通常包括：种子轮（验证想法）→天使轮（产品上市）→A轮（规模化）→B轮（扩张）→C轮及以后（市场领导地位）→IPO（公开上市）。"
  explanation: |
    - 种子轮：只有想法，找亲友或加速器拿小钱验证
    - 天使轮：产品有了雏形，找天使投资人
    - A轮：产品验证成功，需要资金扩张团队和市场
    - B轮：已经盈利或接近盈利，需要资金加速增长
    - C轮+：准备上市或被收购前的最后冲刺
  analogy: "就像游戏升级：种子轮是'新手村'（拿初始装备），天使轮是'出村打怪'（验证能打），A轮是'组队刷副本'（规模化），B轮是'挑战Boss'（扩张），IPO是'通关上榜'（公开上市）。"
  
  examples:
    - context: "生活"
      description: "你想开 lemonade 摊位：向爸妈借50元是'种子轮'，赚了钱证明可行后向同学融资扩大是'天使轮'。"
    - context: "平台赛事"
      description: "在'创业生存战'中，第2轮开启融资选项——模拟的就是天使轮到A轮的决策。"
    - context: "现实商业"
      description: "小米的融资历程：2010年雷军等人出资（天使轮）→2011年晨兴/启明投资（A轮）→2014年云峰/All-Stars（C轮）→2018年IPO。"
  
  non_examples:
    - misconception: "融资越多越好"
      correction: "融资意味着出让股权。过度融资会稀释创始团队控制权，且增加退出压力。"
    - misconception: "只有科技创业需要融资"
      correction: "传统行业的扩张同样需要融资。只是科技公司通常更需要早期资金（因为前期没有现金流）。"

level_adaptations:
  high:
    explanation: "估值与股权稀释：每轮融资创始人持股比例下降。对赌协议、反稀释条款、清算优先权等关键条款。"
    example: "在'投资人对决'中，如果你估值1000万出让20%，下一轮估值5000万再出让20%，创始人还剩多少股份？"
  university:
    explanation: "VC的投资逻辑、尽职调查、term sheet谈判、不同轮次的投资者画像和关注点差异。"
    example: "分析为什么2022年后VC对'烧钱换增长'的模式变得更谨慎？"

platform_mapping:
  game_modes:
    - mode_id: "startup_survival_v1"
      application: "第2轮开启融资选项，模拟早期融资决策"
    - mode_id: "investor_pitch_v1"
      application: "核心机制——估值谈判+融资决策"
  
  ai_tutor_hints:
    - trigger: "学生在天使轮出让过多股权"
      hint: "你在早期出让了太多股权。虽然拿到了钱，但未来几轮稀释后，你可能失去对公司的控制权。早期融资要'够活就行'，不是越多越好。"

