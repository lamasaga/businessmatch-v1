content_type: KN
content_id: "KN-BS-EN-002-v1.0"
title: "MVP（最小可行产品）"
subtitle: "不要等完美，先做一个'足够好'的试试"

target_level: "高中及以上"
target_age: [15, 22]
difficulty: 3
competencies: ["SL-5"]
bloom_level: "apply"

tags: ["创业", "产品", "敏捷", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "商学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "MVP（Minimum Viable Product）是指用最少的时间和资源，开发出一个具备核心功能、可以验证关键假设的产品版本。"
  explanation: "不要花一年做一个'完美产品'再上市，而是花一个月做一个'能用'的版本，让用户告诉你方向对不对。"
  analogy: "就像做蛋糕：不要等所有配料和装饰都完美了再请人品尝。先做一个最简单的原型（面粉+蛋），让人尝尝味道，再决定要不要加奶油和水果。"
  
  examples:
    - context: "生活"
      description: "你想卖手工饼干。MVP不是设计精美包装、租店铺，而是先烤一炉让同学试吃、收集反馈。"
    - context: "平台赛事"
      description: "在'创业生存战'中，第一轮只投入核心功能（一种产品+一个城市），验证后再扩展。"
    - context: "现实商业"
      description: "Dropbox的MVP：创始人先做了一个演示视频，看有没有人感兴趣。视频爆红后才开发产品。"
  
  non_examples:
    - misconception: "MVP就是粗制滥造"
      correction: "MVP要有足够的质量来验证假设。如果质量太差导致用户拒绝，你无法判断是产品方向错还是质量差。"
    - misconception: "MVP只做一次"
      correction: "MVP是一个循环：构建→测量→学习→下一个MVP。持续迭代。"

level_adaptations:
  high:
    explanation: "MVP的关键指标：哪些假设需要验证？如何设计验证实验？A/B测试与MVP的关系。"
    example: "在'回合制策略'中，第一轮的小规模投入就是一种MVP思维——用最小成本验证市场反应。"
  university:
    explanation: "MVP的批判性反思：MVP在不同行业的适用性、技术债务的积累、从MVP到规模化产品的鸿沟。"
    example: "分析微信的MVP策略：为什么第一个版本只有简单的即时通讯功能？"

platform_mapping:
  game_modes:
    - mode_id: "startup_survival_v1"
      application: "核心策略——用最小投入验证商业模式"
    - mode_id: "real_time_challenge_v1"
      application: "快速迭代中的MVP思维"
  
  ai_tutor_hints:
    - trigger: "学生在第一轮过度投入"
      hint: "你似乎在追求'完美开局'。创业中的MVP思维告诉我们：先用最小成本验证方向。如果方向错了，过度投入只会扩大损失。"

