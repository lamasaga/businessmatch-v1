content_type: KN
content_id: "KN-BS-EN-005-v1.0"
title: "精益创业"
subtitle: "用科学的方法创业，而不是靠运气"

target_level: "高中及以上"
target_age: [15, 22]
difficulty: 4
competencies: ["SL-5", "SL-4"]
bloom_level: "apply"

tags: ["创业", "方法论", "敏捷", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "商学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "精益创业（Lean Startup）是由Eric Ries提出的创业方法论，核心循环是：构建（Build）→测量（Measure）→学习（Learn）。通过快速实验和迭代，降低创业失败的风险和成本。"
  explanation: "传统创业：先花大量时间和钱做完美产品，然后上市。精益创业：先做最小可行产品（MVP），让真实用户验证，快速调整方向。"
  analogy: "就像学骑自行车：传统方法是先看100本骑车书（计划），再上车。精益创业是：先上车（MVP）、摔几次（测量反馈）、调整姿势（学习迭代）、最后学会。"
  
  examples:
    - context: "生活"
      description: "你想做一个学习App。传统做法：花半年开发全部功能。精益做法：先做一个微信群，手动帮10个同学解决问题，验证需求后再开发。"
    - context: "平台赛事"
      description: "在'实时经营挑战'中，每轮都是一次Build-Measure-Learn循环——快速调整策略。"
    - context: "现实商业"
      description: "Zappos的精益实验：创始人先在网站上挂鞋的照片（没有库存），有人下单就去实体店买再寄出——用最小成本验证在线卖鞋的需求。"
  
  non_examples:
    - misconception: "精益创业=不做计划"
      correction: "精益创业也需要计划，但计划是基于假设而非确定。关键是'验证假设'而非'执行计划'。"
    - misconception: "精益创业只适用于互联网"
      correction: "精益原则可应用于硬件（Tesla）、服务业（星巴克）、社会企业等任何领域。"

level_adaptations:
  high:
    explanation: "精益创业的工具：假设板、实验板、创新会计（Innovation Accounting）、转型（Pivot）vs坚持（Persevere）的决策框架。"
    example: "在'创业生存战'中，第2轮数据不好，你是'转型'（换方向）还是'坚持'（优化当前方向）？"
  university:
    explanation: "精益创业的批判与演进：精益创业的局限（颠覆性创新）、精益与敏捷/设计思维的关系、大型企业如何应用精益创业（内部创业）。"
    example: "分析亚马逊的'两个披萨团队'：如何用精益原则管理大型企业创新？"

platform_mapping:
  game_modes:
    - mode_id: "startup_survival_v1"
      application: "核心方法论——每轮都是验证假设的机会"
    - mode_id: "real_time_challenge_v1"
      application: "高频Build-Measure-Learn循环"
  
  ai_tutor_hints:
    - trigger: "学生连续多轮不调整策略"
      hint: "精益创业的核心是'快速迭代'。你的策略连续多轮没有变化，这意味着你在'执行'而非'学习'。问问自己：上一轮的数据告诉了你什么？"

