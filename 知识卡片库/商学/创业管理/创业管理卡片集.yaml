---
content_type: KN
content_id: "KN-BS-EN-001-v1.0"
title: "商业模式画布"
subtitle: "一张纸说清楚你的生意怎么做"

target_level: "高中及以上"
target_age: [15, 22]
difficulty: 3
competencies: ["SL-1", "SL-2"]
bloom_level: "apply"

tags: ["创业", "商业模式", "策略", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "商学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "商业模式画布（Business Model Canvas）是描述、分析和设计商业模式的工具，包含9个核心模块：客户细分、价值主张、渠道通路、客户关系、收入来源、核心资源、关键业务、重要合作、成本结构。"
  explanation: "就像画一张地图：谁在买（客户细分）、卖什么（价值主张）、怎么卖（渠道通路）、怎么赚钱（收入来源）、需要什么资源（核心资源）、花多少钱（成本结构）。"
  analogy: "就像开一家餐厅前的规划图：目标客户（学生/白领）、卖什么（快餐/正餐）、怎么卖（堂食/外卖）、怎么留客（会员/优惠）、收入来源（餐费/酒水）、需要什么（厨师/场地）、合作伙伴（供应商/外卖平台）、成本（租金/原料/人工）。"
  
  examples:
    - context: "生活"
      description: "你的'个人商业模式画布'：客户（老师/同学）、价值（帮写作业/组织活动）、渠道（班级群/朋友圈）、收入（零花钱/经验）。"
    - context: "平台赛事"
      description: "在'创业生存战'开始前，学生需要先用画布设计商业模式，再进入模拟。"
    - context: "现实商业"
      description: "滴滴的商业模式画布：客户（乘客+司机）、价值（便捷出行/灵活收入）、渠道（App）、收入（抽成）、资源（技术平台+数据）。"
  
  non_examples:
    - misconception: "画布就是商业计划书"
      correction: "画布是'骨架'，计划书是'血肉'。画布帮助你快速验证想法，计划书用于融资和详细执行。"
    - misconception: "画布拉满9个格就是好的"
      correction: "好的画布是各模块之间的'匹配度'，不是填满。客户细分和价值主张不匹配，再满的 canvas 也没用。"

level_adaptations:
  high:
    explanation: "画布的创新应用：从BMC到价值主张画布、社会商业模式画布、 lean canvas（精益画布）。"
    example: "在'创业生存战'中，为什么有的商业模式在第一轮就失败了？分析画布中的致命缺陷。"
  university:
    explanation: "商业模式的演化理论、平台商业模式、订阅商业模式、商业模式与战略的关系。"
    example: "分析SHEIN的商业模式创新：快时尚+小单快反+社交媒体+独立站，如何重构传统服装行业的商业模式画布？"

platform_mapping:
  game_modes:
    - mode_id: "startup_survival_v1"
      application: "赛前工具——学生必须用画布设计商业模式"
    - mode_id: "investor_pitch_v1"
      application: "路演核心——投资人通过画布快速理解企业"
  
  ai_tutor_hints:
    - trigger: "学生画布中客户细分与价值主张不匹配"
      hint: "你的价值主张是'高端定制'，但客户细分是'价格敏感的学生'。这是画布中最常见的致命错误——价值主张与客户不匹配。考虑调整其中之一。"

