# 财务会计知识卡片集（6张）
# ============================================

---
content_type: KN
content_id: "KN-BS-FI-001-v1.0"
title: "三张财务报表"
subtitle: "企业的'体检报告'：利润表、资产负债表、现金流量表"

target_level: "初中及以上"
target_age: [13, 22]
difficulty: 3
competencies: ["FL-3"]
bloom_level: "understand"

tags: ["财务", "报表", "基础概念", "入门"]
ai_generable: true
author: "平台教研团队"
reviewer: "商学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: |
    三张财务报表是企业财务状况的全景图：
    - 利润表（Income Statement）：一段时间内的收入、成本和利润
    - 资产负债表（Balance Sheet）：某一时点的资产、负债和所有者权益
    - 现金流量表（Cash Flow Statement）：一段时间内现金的流入和流出
  explanation: |
    - 利润表像"成绩单"：这段时间赚了多少钱？
    - 资产负债表像"快照"：现在手里有什么、欠别人什么？
    - 现金流量表像"钱包记录"：钱怎么来的、怎么花的？
  analogy: |
    就像个人理财：
    - 利润表 = 你这个月的工资减去开销 = 存了多少钱
    - 资产负债表 = 你现在有多少存款、多少债、房子值多少钱
    - 现金流量表 = 工资几号到账、房租几号扣、信用卡什么时候还
  
  examples:
    - context: "生活"
      description: "你的'个人三张表'：利润表=月收入-月支出；资产负债表=存款+房产-房贷；现金流量表=每月几号收钱、几号花钱。"
    - context: "平台赛事"
      description: "在'创业生存战'中，平台自动生成简化版三张表，帮助学生理解企业财务全貌。"
    - context: "现实商业"
      description: "上市公司每季度公布三张表——投资者通过这三张表判断公司健康状况。"
  
  non_examples:
    - misconception: "利润高就一定健康"
      correction: "利润高的企业可能现金流断裂（应收账款收不回来）。三张表必须一起看。"
    - misconception: "三张表是会计的事，与商业决策无关"
      correction: "三张表是商业决策的基础。战略、营销、投资都要以财务数据为依据。"

level_adaptations:
  middle:
    explanation: "企业有三张'成绩单'：赚了多少钱（利润表）、现在有什么（资产负债表）、钱怎么流动的（现金流量表）。"
    example: "用 lemonade 摊位演示：利润表=卖了多少钱-花了多少钱；资产负债表=剩下的原料+收到的钱-欠的钱"
  high:
    explanation: "三张表的勾稽关系：利润表中的净利润影响资产负债表的留存收益；现金流量表解释资产负债表中现金的变化。"
    example: "在'创业生存战'中，分析为什么有的团队利润为正但破产了——现金流断裂。"
  university:
    explanation: "财务报表分析框架：比率分析、趋势分析、杜邦分析。财务报表的局限性和操纵空间。"
    example: "分析瑞幸咖啡的财务造假：如何通过三张表的异常信号识别问题？"

platform_mapping:
  game_modes:
    - mode_id: "startup_survival_v1"
      application: "核心机制——学生需要根据三张表做经营决策"
    - mode_id: "investor_pitch_v1"
      application: "投资人通过三张表评估企业价值"
    - mode_id: "turn_based_strategy_v2"
      application: "结算后自动生成简化财务报表"
  
  ai_tutor_hints:
    - trigger: "学生只看利润忽视现金流"
      hint: "利润只是'纸面上的钱'，现金流才是'口袋里的钱'。很多倒闭的企业利润表很漂亮，但现金流断了。看看你的现金流量表。"

