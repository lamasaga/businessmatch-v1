updated_at: "2026-05-12"

knowledge:
  definition: "企业估值是确定企业经济价值的过程。常用方法包括：绝对估值法（DCF现金流折现）、相对估值法（P/E、P/S倍数）、成本法（净资产）。"
  explanation: |
    - DCF：预测企业未来能产生的现金流，折算成今天的价值
    - P/E倍数：参考同行业上市公司的市盈率，乘以你的利润
    - 净资产：企业资产减去负债的账面价值
  analogy: "就像估价一栋房子：DCF是'未来50年租金的总和'，P/E是'同小区房子的单价'，净资产是'建房子的成本'。"
  
  examples:
    - context: "生活"
      description: "你转卖一个游戏账号：看市场上类似账号卖多少钱（相对估值），或者算这个账号未来能帮你赚多少（绝对估值）。"
    - context: "平台赛事"
      description: "在'投资人对决'中，学生需要为虚拟企业估值，投资人基于估值决定是否投资。"
    - context: "现实商业"
      description: "特斯拉的高估值：P/E远超传统车企，因为投资者看好其未来现金流（自动驾驶、能源业务）。"
  
  non_examples:
    - misconception: "估值有一个'正确答案'"
      correction: "估值是艺术+科学。不同方法得出不同结果，最终价格是买卖双方博弈的结果。"
    - misconception: "利润高就估值高"
      correction: "估值取决于未来预期。一家利润高但增长停滞的企业，估值可能低于一家亏损但高速成长的企业。"

level_adaptations:
  high:
    explanation: "估值的核心逻辑：企业价值 = 未来现金流的现值。理解折现率、永续增长率、终端价值。"
    example: "在'投资人对决'中，为什么两家利润相同的企业估值可能差10倍？"
  university:
    explanation: "VC/PE估值方法、创业企业估值的特殊挑战（高不确定性）、实物期权理论、市场法/收益法/成本法的适用场景。"
    example: "分析字节跳动的估值逻辑：为什么一家未上市公司估值超过许多上市公司？"

platform_mapping:
  game_modes:
    - mode_id: "investor_pitch_v1"
      application: "核心机制——路演估值+谈判+投资决策"
    - mode_id: "startup_survival_v1"
      application: "企业成长过程中的价值变化"
  
  ai_tutor_hints:
    - trigger: "学生估值远高于合理范围"
      hint: "你的估值似乎过于乐观。估值需要基于可验证的假设。问问自己：你的预测利润实现概率有多大？折现率是否充分考虑了风险？"

related_content:
  prerequisites: ["KN-BS-FI-001", "KN-BS-FI-002"]
  extensions: ["KN-BS-EN-004", "KN-EC-MA-002"]
  game_mode_applications: ["investor_pitch_v1", "startup_survival_v1"]
