---
content_type: KN
content_id: "KN-BS-FI-002-v1.0"
title: "ROI（投资回报率）"
subtitle: "花出去的每一分钱，值不值？"

target_level: "初中及以上"
target_age: [13, 22]
difficulty: 2
competencies: ["FL-3", "FL-5"]
bloom_level: "apply"

tags: ["财务", "投资", "效率", "基础概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "商学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "ROI（Return on Investment）是衡量投资效率的核心指标，计算公式为：(投资收益 - 投资成本) / 投资成本 × 100%。"
  explanation: "如果你花100元做广告，带来了300元收入，ROI = (300-100)/100 = 200%。ROI越高，说明钱花得越值。"
  analogy: "就像种果树：你买了树苗、花了时间浇水（投资），最后收获了苹果（回报）。ROI就是'每个投入换来了多少收获'。"
  formula: "ROI = (收益 - 成本) / 成本 × 100%"
  
  examples:
    - context: "生活"
      description: "你花50元买复习资料，考试提高了20分（值100元奖学金），ROI = 100%。"
    - context: "平台赛事"
      description: "在'回合制策略'中，计算每个城市的ROI：投入10万带来多少回报？"
    - context: "现实商业"
      description: "营销ROI：每投入1元广告费带来5元销售额，ROI = 400%。"
  
  non_examples:
    - misconception: "ROI高就一定好"
      correction: "ROI高但绝对收益小（如投资1元赚10元，ROI=900%，但只赚了9元），不如ROI低但规模大。"
    - misconception: "ROI只看财务回报"
      correction: "广义ROI还包括品牌提升、客户获取、能力积累等非财务回报。"

level_adaptations:
  middle:
    explanation: "ROI就是'赚了百分之多少'。投入100元，收回150元，ROI=50%。"
    example: "比较两个投资：A投入100赚50，B投入200赚80。哪个ROI高？哪个总收益高？"
  high:
    explanation: "ROI的局限：不考虑时间价值、风险差异、资金规模。需结合NPV、IRR等指标。"
    example: "在'回合制策略'中，TECH投入的ROI可能前期低后期高——需要考虑时间维度。"
  university:
    explanation: "ROI与ROE、ROA、ROIC的关系。投入资本回报率（ROIC）与企业价值创造的联系。"
    example: "亚马逊长期低利润但高市值的秘密：投入全部用于增长，ROIC极高。"

platform_mapping:
  game_modes:
    - mode_id: "turn_based_strategy_v2"
      application: "每轮计算各投入维度的ROI，辅助决策"
    - mode_id: "startup_survival_v1"
      application: "评估不同经营策略的ROI"
  
  ai_tutor_hints:
    - trigger: "学生某维度投入ROI持续为负"
      hint: "你在这个维度的ROI已经连续为负。从财务理性的角度，考虑减少投入或改变策略。但也要注意：某些投入（如品牌建设）的回报有滞后性。"

related_content:
  prerequisites: ["KN-BS-FI-001"]
  extensions: ["KN-BS-FI-004", "KN-BS-FI-006"]
  game_mode_applications: ["turn_based_strategy_v2", "startup_survival_v1"]

