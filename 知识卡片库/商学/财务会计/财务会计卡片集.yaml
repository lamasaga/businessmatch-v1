content_type: KN
content_id: "KN-BS-FI-004-v1.0"
title: "盈亏平衡点"
subtitle: "卖多少才能不亏本？"

target_level: "初中及以上"
target_age: [13, 22]
difficulty: 3
competencies: ["FL-3"]
bloom_level: "apply"

tags: ["财务", "成本", "决策", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "商学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "盈亏平衡点（Break-even Point）是指总收入等于总成本时的销售量。超过这个点开始盈利，低于这个点则亏损。"
  explanation: "如果固定成本是1000元，每杯奶茶售价10元、变动成本4元，那么盈亏平衡点 = 1000 / (10-4) = 167杯。卖167杯刚好保本，卖168杯开始赚钱。"
  analogy: "就像游泳池的排水口：进水（收入）和出水（成本）速度相同时，水位不变——这就是盈亏平衡。进水更快，水位上升（盈利）；出水更快，水位下降（亏损）。"
  formula: "盈亏平衡销量 = 固定成本 / (单价 - 单位变动成本)"
  
  examples:
    - context: "生活"
      description: "你摆摊卖手工饰品：材料包成本200元（固定），每个饰品材料5元（变动），卖15元。盈亏平衡点 = 200/(15-5) = 20个。"
    - context: "平台赛事"
      description: "在'创业生存战'中，计算每轮需要多少收入才能覆盖固定成本——这是生存的第一道关卡。"
    - context: "现实商业"
      description: "电影院：座位数是固定的，每场电影的盈亏平衡点就是上座率需要达到多少。"
  
  non_examples:
    - misconception: "盈亏平衡点就是目标"
      correction: "盈亏平衡只是'不亏'，企业需要盈利才能发展。而且现实中还有其他隐性成本。"
    - misconception: "盈亏平衡点是固定的"
      correction: "价格、成本变化都会影响盈亏平衡点。降价会提高盈亏平衡销量。"

level_adaptations:
  middle:
    explanation: "算一算：卖多少才能把钱赚回来？固定成本÷（每个赚多少钱）= 需要卖多少个。"
    example: " lemonade 摊位：租金100元/天，每杯成本2元，卖5元。每天要卖多少杯才能保本？"
  high:
    explanation: "盈亏平衡分析的应用：定价决策、成本结构优化、安全边际计算。"
    example: "在'创业生存战'中，如果市场需求不确定，应该选择'低固定成本+高变动成本'还是相反？"
  university:
    explanation: "多产品盈亏平衡、目标利润分析、敏感性分析、蒙特卡洛模拟下的盈亏概率。"
    example: "创业公司的'烧钱率'和'跑道'：如何用盈亏平衡思维管理现金流？"

platform_mapping:
  game_modes:
    - mode_id: "startup_survival_v1"
      application: "核心指标——实时显示距离盈亏平衡还有多远"
    - mode_id: "turn_based_strategy_v2"
      application: "帮助评估新市场进入的可行性"
  
  ai_tutor_hints:
    - trigger: "学生长期低于盈亏平衡点"
      hint: "你的经营持续低于盈亏平衡点。这意味着每多卖一个产品，反而亏得更多（因为变动成本还没覆盖）。需要紧急调整：提价、降本、或退出。"

related_content:
  prerequisites: ["KN-BS-FI-003"]
  extensions: ["KN-BS-FI-005", "KN-EC-MI-003"]
  game_mode_applications: ["startup_survival_v1", "turn_based_strategy_v2"]

