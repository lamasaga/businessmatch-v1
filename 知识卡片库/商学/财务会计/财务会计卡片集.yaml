content_type: KN
content_id: "KN-BS-FI-003-v1.0"
title: "固定成本与变动成本"
subtitle: "有些成本不管你卖多少都得付，有些成本随销量变化"

target_level: "初中及以上"
target_age: [13, 22]
difficulty: 2
competencies: ["FL-1"]
bloom_level: "understand"

tags: ["成本", "财务", "基础概念", "入门"]
ai_generable: true
author: "平台教研团队"
reviewer: "商学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: |
    - 固定成本：不随产量变化的成本，如房租、设备折旧、管理人员工资
    - 变动成本：随产量变化的成本，如原材料、计件工资、包装费
  explanation: "开奶茶店：房租每月5000元（固定成本——不管卖1杯还是1000杯都要付），奶茶原料每杯3元（变动成本——卖得越多，原料成本越高）。"
  analogy: "就像手机套餐：月租费是固定成本（不管打多少电话都要付），超出套餐的通话费是变动成本（打得越多付得越多）。"
  
  examples:
    - context: "生活"
      description: "你的零花钱：固定成本是每月必交的公交卡充值，变动成本是买零食和饮料的钱。"
    - context: "平台赛事"
      description: "在'创业生存战'中，每轮必须支付的租金是固定成本，生产原料是变动成本。"
    - context: "现实商业"
      description: "航空业：飞机折旧和机组人员工资是固定成本，燃油和餐食是变动成本。为什么疫情期间航空公司巨亏？因为收入暴跌但固定成本还在。"
  
  non_examples:
    - misconception: "固定成本永远不变"
      correction: "固定成本在'一定范围内'不变。如果产量大幅增加，可能需要租更大的场地（固定成本跳跃上升）。"
    - misconception: "降低固定成本总是好的"
      correction: "降低固定成本可能意味着降低产能上限或服务质量。需要权衡。"

level_adaptations:
  middle:
    explanation: "固定成本=不管卖多少都要花的钱；变动成本=卖得越多花得越多的钱。"
    example: " lemonade 摊位：摊位租金是固定成本，柠檬和糖是变动成本。"
  high:
    explanation: "成本结构对经营杠杆的影响：固定成本占比高意味着经营杠杆高（利润波动大）。"
    example: "在'创业生存战'中，选择'高固定成本+低变动成本'（自动化工厂）还是'低固定成本+高变动成本'（外包生产）？"
  university:
    explanation: "半变动成本、阶梯成本、本量利分析（CVP）、经营杠杆系数。"
    example: "SaaS企业的成本结构：为什么固定成本极高但边际成本趋近于零？"

platform_mapping:
  game_modes:
    - mode_id: "startup_survival_v1"
      application: "核心机制——固定成本每轮必须支付，变动成本随产量变化"
    - mode_id: "turn_based_strategy_v2"
      application: "某些投入的固定/变动属性影响策略选择"
  
  ai_tutor_hints:
    - trigger: "学生销量低但固定成本负担重"
      hint: "你的销量不足以覆盖固定成本。两个选择：提升销量（摊薄固定成本）或减少固定成本（但可能限制增长）。"

related_content:
  prerequisites: ["KN-EC-MI-004"]
  extensions: ["KN-BS-FI-004", "KN-BS-FI-005"]
  game_mode_applications: ["startup_survival_v1", "turn_based_strategy_v2"]

