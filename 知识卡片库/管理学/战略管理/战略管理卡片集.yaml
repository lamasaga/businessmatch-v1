content_type: KN
content_id: "KN-MG-ST-004-v1.0"
title: "蓝海战略"
subtitle: "不要在红海里血拼，去寻找新的蓝海"

target_level: "高中及以上"
target_age: [16, 22]
difficulty: 4
competencies: ["SL-1", "ML-3"]
bloom_level: "create"

tags: ["战略", "创新", "差异化", "高阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "管理学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "蓝海战略（Blue Ocean Strategy）是由Kim和Mauborgne提出的战略框架，主张企业不应在现有市场（红海）中与竞争对手厮杀，而是通过价值创新创造新的市场空间（蓝海）。"
  explanation: "红海 = 现有市场，竞争激烈，利润像血一样红。蓝海 = 尚未存在的市场，没有竞争对手，利润丰厚。蓝海战略通过'同时追求差异化和低成本'来打破价值-成本的权衡。"
  analogy: "就像捕鱼：红海是大家都在的近海，鱼少人多，竞争激烈。蓝海是远海的未知水域——可能有更多鱼，也可能什么都没有。蓝海战略教你如何用新技术（更好的船）降低远海捕捞的成本，同时找到新的鱼群。"
  
  examples:
    - context: "生活"
      description: "学校社团：不是加入已有的热门社团（红海），而是创建一个全新的社团（蓝海）——如'无人机航拍社'。"
    - context: "平台赛事"
      description: "在'回合制策略'中，当所有人都挤在 TECH 路线时，PATHFINDER 路线可能就是蓝海。"
    - context: "现实商业"
      description: "黄牛的蓝海：不是和传统出租车竞争（红海），而是创造了一个全新的市场——共享出行。"
  
  non_examples:
    - misconception: "蓝海就是没有竞争"
      correction: "蓝海最终也会变成红海。蓝海战略的关键是持续创新，而不是一劳永逸。"
    - misconception: "蓝海就是完全全新的市场"
      correction: "蓝海通常是从红海边缘开拓出来的，不是凭空创造。"

level_adaptations:
  high:
    explanation: "蓝海战略的工具：价值曲线、四步动作框架（剔除-减少-增加-创造）、战略布局图。"
    example: "在'品牌造物坊'中，用四步动作框架设计一个蓝海品牌。"
  university:
    explanation: "蓝海的可持续性问题、蓝海与颠覆性创新的关系、平台经济中的蓝海创造（多边市场）。"
    example: "分析抖音如何从红海的短视频市场中创造蓝海？"

platform_mapping:
  game_modes:
    - mode_id: "turn_based_strategy_v2"
      application: "识别市场中的蓝海路线/城市"
    - mode_id: "brand_workshop_v1"
      application: "核心策略——用价值创新创造新市场"
    - mode_id: "case_simulation_v1"
      application: "案例分析中的蓝海识别"
  
  ai_tutor_hints:
    - trigger: "学生在拥挤的市场中正面竞争"
      hint: "你正在红海里血拼。蓝海战略告诉我们：有时候最好的竞争策略是不竞争——创造一个对手还没发现的市场。看看有没有被忽视的机会？"

related_content:
  prerequisites: ["KN-MG-ST-002", "KN-MG-ST-003"]
  extensions: ["KN-BS-MK-001", "KN-BS-EN-003"]
  game_mode_applications: ["turn_based_strategy_v2", "brand_workshop_v1"]

---
content_type: KN
content_id: "KN-MG-ST-005-v1.0"
title: "价值链"
subtitle: "企业的每个活动，都在创造价值（或浪费）"

target_level: "高中及以上"
target_age: [16, 22]
difficulty: 4
competencies: ["SL-2", "FL-1"]
bloom_level: "analyze"

tags: ["战略", "运营", "效率", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "管理学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "价值链（Value Chain）是波特提出的分析企业活动的框架，将企业的活动分为主要活动（进料物流、生产、出货物流、营销、服务）和支持活动（采购、技术开发、人力资源管理、基础设施），每个环节都可以创造价值或产生成本。"
  explanation: "就像做一道菜：买菜（进料）、洗菜切菜（生产）、装盘上桌（出货）、菜单宣传（营销）、售后服务（服务）。每个环节都在影响顾客最终愿意付多少钱。"
  analogy: "就像接力赛：每个选手（环节）的表现都影响最终成绩。如果第三棒掉了接力棒，即使其他棒再快也追不回来。"
  
  examples:
    - context: "生活"
      description: "你组织班级活动：策划（技术开发）、采购物资（采购）、布置场地（生产）、通知同学（营销）、现场服务（服务）。"
    - context: "平台赛事"
      description: "在'产业链角色扮演'中，每个角色就是价值链的一个环节——理解上下游如何共同创造价值。"
    - context: "现实商业"
      description: "Zara的价值链优势：设计（快速响应）、生产（小批量多批次）、物流（48小时到店）、营销（门店即广告）。"
  
  non_examples:
    - misconception: "价值链就是供应链"
      correction: "供应链关注物料流动，价值链关注价值创造。供应链是价值链的一部分。"
    - misconception: "每个环节都要最强"
      correction: "企业的资源有限，应该在关键环节建立优势，非关键环节可以外包。"

level_adaptations:
  high:
    explanation: "价值链分析的方法：识别价值活动→评估成本/价值→寻找竞争优势来源→优化或外包。"
    example: "在'产业链角色扮演'中，分析哪个环节创造了最大价值？哪个环节是瓶颈？"
  university:
    explanation: "全球价值链（GVC）、价值链的数字化转型、平台经济中的价值链重构、价值链与社会责任。"
    example: "分析苹果的价值链：设计在美国，生产在中国，销售在全球。苹果掌握了价值链的哪个环节？为什么？"

platform_mapping:
  game_modes:
    - mode_id: "supply_chain_rpg_v1"
      application: "核心机制——体验价值链各环节的价值创造"
    - mode_id: "turn_based_strategy_v2"
