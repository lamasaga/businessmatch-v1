---
content_type: KN
content_id: "KN-MG-ST-001-v1.0"
title: "SWOT分析"
subtitle: "看清自己，看清环境"

target_level: "初中及以上"
target_age: [13, 22]
difficulty: 2
competencies: ["SL-1", "SL-4"]
bloom_level: "apply"

tags: ["战略", "分析", "基础概念", "入门"]
ai_generable: true
author: "平台教研团队"
reviewer: "管理学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "SWOT分析是一种战略规划工具，通过评估内部因素（优势Strengths、劣势Weaknesses）和外部因素（机会Opportunities、威胁Threats）来制定战略。"
  explanation: |
    - 优势：你比别人强的地方（如技术好、团队强）
    - 劣势：你不如别人的地方（如资金少、经验浅）
    - 机会：外部环境中的有利因素（如新市场、政策支持）
    - 威胁：外部环境中的不利因素（如新竞争对手、经济下行）
  analogy: "就像打游戏前看地图：优势是你的装备，劣势是你的短板，机会是地图上的宝藏，威胁是埋伏的敌人。"
  
  examples:
    - context: "生活"
      description: "你参加演讲比赛：优势（口才好）、劣势（容易紧张）、机会（主题是你擅长的）、威胁（有经验丰富的对手）。"
    - context: "平台赛事"
      description: "在'回合制策略'每轮开始前，用SWOT分析当前局势：优势（技术领先）、劣势（资金少）、机会（新城市开放）、威胁（对手联盟）。"
    - context: "现实商业"
      description: "抖音的SWOT：优势（算法强）、劣势（内容监管压力）、机会（海外市场）、威胁（腾讯系竞争）。"
  
  non_examples:
    - misconception: "SWOT只是列清单"
      correction: "SWOT的关键是'匹配'：SO策略（优势+机会）、WO策略（劣势+机会）、ST策略（优势+威胁）、WT策略（劣势+威胁）。"
    - misconception: "SWOT分析一次就够了"
      correction: "环境在变化，SWOT需要定期更新。尤其是快速变化的行业。"

level_adaptations:
  middle:
    explanation: "做决策前先画四个格子：我有什么优势？有什么不足？外面有什么机会？有什么危险？"
    example: "为班级义卖活动做SWOT分析。"
  high:
    explanation: "SWOT的进阶：TOWS矩阵（将因素配对生成具体战略）、动态SWOT（随时间变化）。"
    example: "在'投资人对决'中，用SWOT分析目标企业，判断投资价值。"
  university:
    explanation: "SWOT的局限性和批判、资源基础观（RBV）与SWOT的结合、动态能力视角下的战略分析。"
    example: "为什么SWOT在稳定行业有效，但在VUCA（易变、不确定、复杂、模糊）环境中可能失效？"

platform_mapping:
  game_modes:
    - mode_id: "turn_based_strategy_v2"
      application: "每轮决策前的标准分析工具"
    - mode_id: "case_simulation_v1"
      application: "案例分析的第一步"
    - mode_id: "investor_pitch_v1"
      application: "投资人评估企业的框架"
  
  ai_tutor_hints:
    - trigger: "学生连续多轮采用同一策略"
      hint: "你的策略似乎很久没有更新了。市场环境在变化，每轮开始前做一次快速SWOT分析，可能会发现新的机会或威胁。"

related_content:
  prerequisites: []
  extensions: ["KN-MG-ST-002", "KN-MG-ST-003", "KN-MG-ST-004"]
