content_type: KN
content_id: "KN-MG-ST-002-v1.0"
title: "波特五力"
subtitle: "一个行业赚不赚钱，看五个力量"

target_level: "高中及以上"
target_age: [15, 22]
difficulty: 4
competencies: ["SL-1", "ML-3"]
bloom_level: "analyze"

tags: ["战略", "竞争", "行业", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "管理学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "波特五力模型是分析行业竞争强度和盈利能力的框架，包括：现有竞争者的竞争强度、潜在进入者的威胁、替代品的威胁、供应商的议价能力、购买者的议价能力。"
  explanation: |
    - 现有竞争者：行业内有多少对手？竞争激烈吗？
    - 潜在进入者：新对手容易进来吗？（进入壁垒高吗？）
    - 替代品：消费者可以用别的东西替代你吗？
    - 供应商：你的原料供应商能随便涨价吗？
    - 购买者：你的客户能随便压价吗？
  analogy: "就像你是一个武林门派的掌门：现有竞争者（其他门派）、潜在进入者（想开新门派的人）、替代品（人们不练武改跑步了）、供应商（卖你武器的铁匠）、购买者（来学武功的徒弟）。五个力量决定你的门派能不能赚钱。"
  
  examples:
    - context: "生活"
      description: "学校门口的奶茶店：现有竞争者（5家）、潜在进入者（低——开店成本低）、替代品（饮料机、便利店）、供应商（奶/茶供应商多，议价力低）、购买者（学生敏感度高，议价力强）。结论：行业竞争激烈，利润薄。"
    - context: "平台赛事"
      description: "在'产业链角色扮演'中，分析你在产业链中的议价能力——这就是五力的应用。"
    - context: "现实商业"
      description: "航空业五力分析：进入壁垒高（需要牌照和飞机）、替代品威胁中（高铁）、供应商议价力中（波音/空客寡头）、购买者议价力高（OTA平台）、现有竞争极其激烈。结论：行业整体盈利能力弱。"
  
  non_examples:
    - misconception: "五力分析只适用于大企业"
      correction: "任何规模的企业都可以用它理解行业环境。小企业的优势恰恰是灵活，可以在五力的缝隙中找到机会。"
    - misconception: "五力是静态的"
      correction: "五力会随时间变化。比如技术突破可能降低进入壁垒，政策变化可能改变供应商议价力。"

level_adaptations:
  high:
    explanation: "五力的量化评估、五力之间的相互影响、五力与企业战略的对应关系（成本领先、差异化、集中化）。"
    example: "在'回合制策略'中，用五力分析不同城市的市场竞争强度。"
  university:
    explanation: "五力模型的批判：忽视了互补者（第六力）、网络效应、平台经济中的五力变形、动态竞争。"
    example: "分析平台经济（如淘宝）的五力：传统五力框架如何变形？"

platform_mapping:
  game_modes:
    - mode_id: "turn_based_strategy_v2"
      application: "分析市场竞争格局，选择进入/退出策略"
    - mode_id: "supply_chain_rpg_v1"
      application: "产业链中的议价能力分析"
    - mode_id: "market_fair_v1"
      application: "分析集市中的五力变化"
  
  ai_tutor_hints:
    - trigger: "学生进入竞争过于激烈的市场"
      hint: "你用波特五力分析这个市场了吗？现有竞争者众多、进入壁垒低、替代品多——这意味着行业利润会被快速侵蚀。考虑寻找五力较弱的蓝海市场。"

related_content:
  prerequisites: ["KN-MG-ST-001"]
  extensions: ["KN-MG-ST-003", "KN-MG-ST-004", "KN-EC-MI-005"]
  game_mode_applications: ["turn_based_strategy_v2", "supply_chain_rpg_v1"]

