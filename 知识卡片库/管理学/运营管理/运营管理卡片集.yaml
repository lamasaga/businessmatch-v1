content_type: KN
content_id: "KN-MG-OP-003-v1.0"
title: "质量管理"
subtitle: "质量不是检查出来的，是设计出来的"

target_level: "高中及以上"
target_age: [15, 22]
difficulty: 3
competencies: ["SL-2", "EL-1"]
bloom_level: "apply"

tags: ["运营", "质量", "标准", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "管理学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "质量管理是指通过系统化的方法确保产品或服务满足或超越客户期望的管理活动。从'事后检查'（QC）发展到'过程控制'（QA）再到'全员参与'（TQM）和'六西格玛'（追求近乎零缺陷）。"
  explanation: "就像做饭：质量管理不是'做完后尝一口看咸不咸'（事后检查），而是'从买菜开始就选新鲜食材'（源头控制）和'按照菜谱精确操作'（过程控制）。"
  analogy: "就像盖房子：传统方式是盖完再检查有没有裂缝（QC）。现代方式是从设计（蓝图）、材料（钢筋水泥）、施工（每道工序）全程控制（TQM）——这样盖出来的房子更可靠。"
  
  examples:
    - context: "生活"
      description: "你写作业：检查错别字是QC，写作时先列提纲是QA，平时多读书提升写作能力就是TQM。"
    - context: "平台赛事"
      description: "在'品牌造物坊'中，质量管理体现在品牌一致性：每次传播是否都符合品牌标准？"
    - context: "现实商业"
      description: "丰田'安灯'系统：任何工人发现质量问题都可以拉停整条生产线——质量优先于产量。"
  
  non_examples:
    - misconception: "质量管理就是多检查"
      correction: "过度检查本身就是浪费。质量管理的目标是让问题不发生，而不是发生后发现。"
    - misconception: "高质量一定高成本"
      correction: "'质量是免费的'（Crosby）。预防缺陷的成本远低于修复缺陷的成本。"

level_adaptations:
  high:
    explanation: "质量成本模型：预防成本、鉴定成本、内部故障成本、外部故障成本。PDCA与DMAIC方法论。"
    example: "在'产业链角色扮演'中，如何在成本和质量的权衡中找到最优解？"
  university:
    explanation: "六西格玛的统计基础、全面质量管理（TQM）的文化维度、ISO标准、服务质量管理（SERVQUAL模型）。"
    example: "分析波音737 MAX的质量危机：质量管理的系统性失败如何发生？"

platform_mapping:
  game_modes:
    - mode_id: "real_time_challenge_v1"
      application: "质量与速度的平衡决策"
    - mode_id: "brand_workshop_v1"
      application: "品牌一致性的质量管理"
  
  ai_tutor_hints:
    - trigger: "学生牺牲质量换取短期成本节约"
      hint: "你在用长期的品牌声誉换取短期的成本节约。质量管理告诉我们：外部故障成本（品牌受损、客户流失）往往远高于预防成本。"

related_content:
  prerequisites: ["KN-MG-OP-001"]
  extensions: ["KN-MG-OP-002", "KN-MG-ET-003"]
  game_mode_applications: ["real_time_challenge_v1", "brand_workshop_v1"]
