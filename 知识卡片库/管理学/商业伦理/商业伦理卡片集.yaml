---
content_type: KN
content_id: "KN-MG-ET-001-v1.0"
title: "利益相关者理论"
subtitle: "企业的决策，影响着谁？"

target_level: "高中及以上"
target_age: [15, 22]
difficulty: 3
competencies: ["EL-2", "SL-1"]
bloom_level: "analyze"

tags: ["伦理", "利益相关者", "责任", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "伦理学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "利益相关者理论（Stakeholder Theory）认为企业的责任不仅在于股东（Shareholder），还应考虑所有受企业决策影响的群体（Stakeholder），包括员工、客户、供应商、社区、环境等。"
  explanation: "传统观点：企业只为股东赚钱。利益相关者观点：企业像一个生态系统，股东只是其中一部分。忽视了员工、客户、社区，企业也无法长期生存。"
  analogy: "就像花园：股东是花园的主人（想要收获），但如果没有土壤（环境）、水（供应商）、阳光（社区支持）、园丁（员工），花园根本长不出果实。"
  
  examples:
    - context: "生活"
      description: "班级组织活动：不仅要考虑活动效果（股东价值），还要考虑参与同学的安全（员工/参与者）、借用场地的规则（社区）、预算是否合理（财务）。"
    - context: "平台赛事"
      description: "在'ESG可持续经营'中，每个决策都会影响多个利益相关者——学生需要权衡多方利益。"
    - context: "现实商业"
      description: "Patagonia：把环境作为核心利益相关者，'地球优先，利润其次'——反而获得了更高的品牌忠诚度和长期利润。"
  
  non_examples:
    - misconception: "利益相关者理论就是'好人主义'"
      correction: "利益相关者理论有坚实的商业逻辑：照顾好利益相关者，长期利润反而更高。这不是道德绑架，而是战略智慧。"
    - misconception: "所有利益相关者同等重要"
      correction: "不同情境下，利益相关者的优先级不同。关键是'识别'和'权衡'，不是'平均对待'。"

level_adaptations:
  high:
    explanation: "利益相关者映射：权力-利益矩阵（高权力高利益：重点管理；低权力低利益：最小关注）。利益相关者之间的冲突与协调。"
    example: "在'产业链角色扮演'中，分析每个角色的利益诉求和权力——谁是关键利益相关者？"
  university:
    explanation: "利益相关者理论的演进： descriptive（描述企业如何运作）、instrumental（利益相关者管理如何影响绩效）、normative（为何应重视利益相关者）。"
    example: "分析马斯克收购Twitter后的利益相关者冲突：广告商、用户、员工、监管者，如何平衡？"

platform_mapping:
  game_modes:
    - mode_id: "esg_scoring_v1"
      application: "核心机制——每个决策都会影响不同利益相关者的评分"
    - mode_id: "case_simulation_v1"
      application: "案例分析中的利益相关者识别"
    - mode_id: "supply_chain_rpg_v1"
      application: "产业链上下游的利益相关者博弈"
  
  ai_tutor_hints:
    - trigger: "学生决策严重损害某利益相关者"
      hint: "你的决策给某个利益相关者（如员工或环境）带来了很大成本。利益相关者理论提醒我们：短期压榨某一方可能带来长期反弹。考虑更平衡的方案。"

