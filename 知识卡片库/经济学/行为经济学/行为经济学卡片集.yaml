---
content_type: KN
content_id: "KN-EC-BE-001-v1.0"
title: "锚定效应"
subtitle: "第一个看到的数字，悄悄改变了你的判断"

target_level: "高中及以上"
target_age: [15, 22]
difficulty: 3
competencies: ["ML-4", "SL-4"]
bloom_level: "understand"

tags: ["心理", "决策", "定价", "行为经济学"]
ai_generable: true
author: "平台教研团队"
reviewer: "经济学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "锚定效应是指人们在做出判断时，过度依赖最先获得的信息（锚点），即使这个锚点与决策无关。"
  explanation: "如果你先看到'原价1999，现价999'，你会觉得999很划算。但如果直接看到999，你可能觉得贵。那个'1999'就是锚。"
  analogy: "就像抛锚的船——锚点（第一个数字）固定了你的判断范围，后续的波动都围绕这个锚展开。"
  
  examples:
    - context: "生活"
      description: "房产中介先带你看几套超预算的房子，再看目标价位的房子，你会觉得目标价位的房子'性价比真高'。"
    - context: "平台赛事"
      description: "在'拍卖交易大厅'中，起拍价设得很高，最终成交价往往也会偏高——即使商品实际不值那么多。"
    - context: "现实商业"
      description: "星巴克的'超大杯'：设置一个明显不划算的大杯选项，让中杯看起来性价比更高。"
  
  non_examples:
    - misconception: "锚定效应只影响不聪明的人"
      correction: "锚定效应影响所有人，包括专家和经济学家。它是大脑的自动加工，与智商无关。"
    - misconception: "知道锚定效应就能免疫"
      correction: "即使你知道锚定效应的存在，仍然会被影响。唯一的办法是主动寻找反锚（其他参考点）。"

level_adaptations:
  high:
    explanation: "锚定效应的机制：调整不足（insufficient adjustment）。如何设计反锚策略：寻找多个参考点、延迟决策。"
    example: "在'投资人对决'中，路演时第一个数字（估值）会锚定投资人的心理预期。如何设置最优锚点？"
  university:
    explanation: "锚定效应的神经基础（前额叶皮层与杏仁核的互动）、专家vs新手的锚定差异、去锚定策略的实证研究。"
    example: "谈判中的锚定：先出价者占据优势。如何打破对方的锚？引入新的信息维度。"

platform_mapping:
  game_modes:
    - mode_id: "auction_trading_v1"
      application: "起拍价设置对最终成交价的锚定影响"
    - mode_id: "investor_pitch_v1"
      application: "路演中估值声明的锚定效应"
    - mode_id: "turn_based_strategy_v2"
      application: "对手首轮投资对你决策的锚定"
  
  ai_tutor_hints:
    - trigger: "学生在拍卖中出价接近起拍价"
      hint: "注意锚定效应！起拍价只是一个参考，不是商品的真实价值。问问自己：如果没有看到起拍价，这个商品我愿意出多少钱？"

personality_mapping:
  recommended:
    - mbti: "INTP"
      reason: "喜欢分析认知偏差和决策机制"
  challenge_for:
    - mbti: "ESTP"
      adjustment: "用具体拍卖实验数据展示锚定效应的力量"

multimedia:
  illustration_prompt: "一个巨大的船锚沉入海中，海面上漂浮着数字标签'1999'，远处有一艘小船（代表判断）被锚链拉住"
  interactive_demo: "experiment_anchoring: 两组学生看到不同的'参考价'，然后出价，对比结果差异"

related_content:
  prerequisites: ["KN-EC-MI-001"]
  extensions: ["KN-EC-BE-002", "KN-EC-BE-003", "KN-BS-MK-005"]
  game_mode_applications: ["auction_trading_v1", "investor_pitch_v1"]

---
content_type: KN
content_id: "KN-EC-BE-002-v1.0"
title: "损失厌恶"
subtitle: "失去100元的痛苦，比得到100元的快乐更强烈"

target_level: "高中及以上"
target_age: [15, 22]
difficulty: 3
competencies: ["FL-5", "SL-1"]
bloom_level: "understand"

tags: ["心理", "风险", "决策", "行为经济学"]
ai_generable: true
author: "平台教研团队"
reviewer: "经济学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "损失厌恶是指人们对损失的敏感度远高于对同等收益的喜悦。心理学家卡尼曼发现：失去100元的痛苦≈得到200元的快乐。"
  explanation: "如果你已经赚了1000元，再赚100元感觉一般。但如果从1000元亏了100元，你会非常难受——虽然金额一样。"
  analogy: "就像秤——左边放'得到'的砝码，右边放'失去'的砝码。右边的重量是左边的2倍，才能让秤平衡。"
  
  examples:
    - context: "生活"
      description: "股票跌了你不舍得卖（承认损失太痛苦），结果越跌越多。股票涨了你也舍不得卖（怕错过更多涨幅）。"
    - context: "平台赛事"
      description: "在'创业生存战'中，学生在亏损时倾向于冒险翻盘（想避免损失），在盈利时倾向于保守（想保住成果）。"
    - context: "现实商业"
      description: "免费试用策略：一旦你开始使用（建立了'拥有感'），取消订阅就像'失去'，所以你更可能付费。"
  
  non_examples:
    - misconception: "损失厌恶意味着人们从不愿意冒险"
      correction: "恰恰相反——当人们已经处于'损失区域'时，反而更愿意冒险（赌一把翻本）。"
    - misconception: "损失厌恶只影响个人投资"
      correction: "它影响所有决策：企业不愿退出亏损业务、政府不愿承认政策失败。"

level_adaptations:
  high:
    explanation: "损失厌恶导致的决策偏差：禀赋效应（拥有的东西估值更高）、现状偏见、沉没成本谬误。"
    example: "在'拍卖交易大厅'中，为什么已经出了高价的人更难停手？因为'放弃'意味着承认损失。"
  university:
    explanation: "前景理论（Prospect Theory）的完整框架：价值函数的S形曲线、参考点依赖、概率加权。"
    example: "企业并购中的损失厌恶：CEO为什么宁愿维持亏损的多元化业务，也不愿聚焦核心？"

platform_mapping:
  game_modes:
    - mode_id: "startup_survival_v1"
      application: "亏损时的冒险倾向vs盈利时的保守倾向"
    - mode_id: "auction_trading_v1"
      application: "已出价者的'沉没成本'心理——越投越难退出"
    - mode_id: "turn_based_strategy_v2"
      application: "领先者的保守防御vs落后者的冒险反击"
  
  ai_tutor_hints:
    - trigger: "学生因不愿承认损失而持续投入亏损策略"
      hint: "你似乎陷入了'损失厌恶'——承认之前的决策失误很痛苦，但继续投入只会让损失更大。商业中，及时止损比硬撑更需要勇气。"
    - trigger: "学生在拍卖中加价超出预算"
      hint: "你已经投入了这么多，放弃就意味着'损失'已出的价。但这正是损失厌恶在影响你。冷静评估：这个商品的真正价值是多少？"

related_content:
  prerequisites: ["KN-EC-MI-004"]
  extensions: ["KN-EC-BE-003", "KN-BS-FI-005"]
  game_mode_applications: ["startup_survival_v1", "auction_trading_v1"]

