content_type: KN
content_id: "KN-EC-MA-002-v1.0"
title: "通货膨胀"
subtitle: "为什么钱越来越不值钱？"

target_level: "高中及以上"
target_age: [16, 22]
difficulty: 3
competencies: ["FL-4"]
bloom_level: "understand"

tags: ["宏观经济", "货币", "价格", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "经济学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "通货膨胀是指一段时间内物价总水平持续上涨，导致货币购买力下降的现象。"
  explanation: "如果去年一杯奶茶8元，今年10元，奶茶的价格上涨了25%。当大多数商品都这样涨价时，就是通货膨胀。"
  analogy: "就像游泳池的水被慢慢稀释——池子（经济体）还是那么大，但水（货币）越来越多，每滴水的'浓度'就降低了。"
  formula: "通货膨胀率 = (本期物价水平 - 上期物价水平) / 上期物价水平 × 100%"
  
  examples:
    - context: "生活"
      description: "爷爷奶奶说'以前1分钱能买糖，现在1块钱才能买'——这就是几十年的通货膨胀累积效应。"
    - context: "平台赛事"
      description: "在'宏观经济沙盘'中，央行印钞过多会导致虚拟通货膨胀，企业需要调整定价策略。"
    - context: "现实商业"
      description: "2021-2022年全球通胀：疫情后货币宽松 + 供应链断裂 = 物价飞涨。"
  
  non_examples:
    - misconception: "个别商品涨价就是通胀"
      correction: "通胀是物价总水平持续上涨。单一商品涨价可能是供需变化，不是通胀。"
    - misconception: "通胀总是坏事"
      correction: "适度通胀（2-3%）有利于经济——鼓励消费和投资。通缩（物价下跌）反而更危险。"

level_adaptations:
  high:
    explanation: "通胀的类型：需求拉动型、成本推动型、结构性。通胀的影响：再分配效应（固定收入者受损，债务人受益）。"
    example: "为什么贷款买房在通胀时期更划算？因为你的收入会随通胀增长，但还款额固定。"
  university:
    explanation: "菲利普斯曲线（通胀与失业的权衡）、货币数量论、通胀预期、恶性通胀的社会后果。"
    example: "津巴布韦和魏玛德国的恶性通胀：当货币变成废纸时，社会会发生什么？"

platform_mapping:
  game_modes:
    - mode_id: "macro_sandbox_v1"
      application: "核心变量——通胀率影响企业成本结构和消费者购买力"
    - mode_id: "global_trade_v1"
      application: "汇率与通胀的关系——高通胀国家货币贬值"
  
  ai_tutor_hints:
    - trigger: "通胀环境下学生保持价格不变"
      hint: "注意：虚拟经济中出现了通货膨胀信号。如果你的价格不变，实际收入在下降。考虑调整定价策略以应对通胀。"

related_content:
  prerequisites: ["KN-EC-MA-001"]
  extensions: ["KN-EC-MA-004", "KN-BS-FI-005"]
  game_mode_applications: ["macro_sandbox_v1", "global_trade_v1"]

