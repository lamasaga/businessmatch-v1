content_type: KN
content_id: "KN-EC-MA-003-v1.0"
title: "经济周期"
subtitle: "为什么经济像过山车一样起伏？"

target_level: "高中及以上"
target_age: [16, 22]
difficulty: 4
competencies: ["SL-3", "SL-5"]
bloom_level: "analyze"

tags: ["宏观经济", "周期", "策略", "高阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "经济学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "经济周期是指经济活动沿着长期增长趋势所经历的扩张、顶峰、收缩、谷底四个阶段的循环波动。"
  explanation: "就像四季轮回：春天（复苏）→夏天（繁荣）→秋天（衰退）→冬天（萧条）→春天又来了。企业在不同阶段需要不同的策略。"
  analogy: "就像海边的潮汐——有涨潮（经济繁荣，大家赚钱），也有退潮（经济衰退，企业倒闭）。聪明的渔民知道什么时候出海，什么时候修船。"
  
  examples:
    - context: "生活"
      description: "2008年金融危机是衰退期，之后2020年疫情是又一次冲击。疫情期间旅游餐饮业寒冬，但在线教育和电商爆发。"
    - context: "平台赛事"
      description: "在'宏观经济沙盘'中，经济周期直接影响所有企业的市场环境——繁荣期扩张，衰退期收缩。"
    - context: "现实商业"
      description: "万科的'冬天论'：在房地产市场繁荣时储备现金，等待冬天收购优质资产。"
  
  non_examples:
    - misconception: "经济周期可以完全预测"
      correction: "周期的大致规律可识别，但具体转折点和幅度难以精确预测。"
    - misconception: "政府可以消除经济周期"
      correction: "政策可以平滑周期，但无法消除。人为压制波动可能导致更大的危机。"

level_adaptations:
  high:
    explanation: "经济周期的四个阶段特征、领先指标（PMI、消费者信心）、滞后指标（失业率）。"
    example: "为什么股市往往在经济最差的时候开始上涨？因为股市预期的是未来6-12个月的经济。"
  university:
    explanation: "真实经济周期理论、凯恩斯主义vs货币主义的政策争论、金融周期与实体经济的互动。"
    example: "中国房地产周期的独特性：政策主导型周期 vs 市场主导型周期。"

platform_mapping:
  game_modes:
    - mode_id: "macro_sandbox_v1"
      application: "核心机制——系统模拟四阶段经济周期，玩家需要根据周期调整战略"
    - mode_id: "slow_company_challenge_v1"
      application: "长期经营中经历完整周期，考验跨周期战略能力"
  
  ai_tutor_hints:
    - trigger: "学生在繁荣期过度扩张"
      hint: "繁荣期就像涨潮，但也意味着退潮即将到来。你的高杠杆扩张在衰退期可能成为致命负担。考虑'反周期操作'。"
    - trigger: "学生在衰退期完全停止投资"
      hint: "衰退期虽然艰难，但也是低成本扩张的机会。有现金的企业可以在冬天收购优质资产，等待春天。"

related_content:
  prerequisites: ["KN-EC-MA-001", "KN-EC-MA-002"]
  extensions: ["KN-MG-ST-003", "KN-BS-FI-005"]
  game_mode_applications: ["macro_sandbox_v1", "slow_company_challenge_v1"]

