---
content_type: KN
content_id: "KN-EC-MA-001-v1.0"
title: "GDP（国内生产总值）"
subtitle: "一个国家一年内创造了多少价值？"

target_level: "高中及以上"
target_age: [16, 22]
difficulty: 3
competencies: ["FL-2"]
bloom_level: "understand"

tags: ["宏观经济", "国家经济", "指标", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "经济学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "GDP（Gross Domestic Product）是一个国家或地区在一定时期内（通常是一年）生产的所有最终商品和服务的市场价值总和。"
  explanation: "就像一个班级的'总成绩'——把所有科目（产业）的分数加起来，就是全班的经济实力。"
  analogy: "GDP就像一家餐厅一年的总营业额——所有菜品销售额加起来，但不包括进货成本（只算最终价值）。"
  formula: "GDP = C（消费）+ I（投资）+ G（政府支出）+ (X - M)（净出口）"
  
  examples:
    - context: "生活"
      description: "你买奶茶、企业建工厂、政府修马路、出口手机——这些都计入GDP。"
    - context: "平台赛事"
      description: "在'宏观经济沙盘'中，所有企业的产出之和就是虚拟经济的GDP。"
    - context: "现实商业"
      description: "中国GDP世界第二，但人均GDP还有提升空间。"
  
  non_examples:
    - misconception: "GDP越高人民生活越幸福"
      correction: "GDP不衡量收入分配、环境质量、工作时长、幸福感。一个污染严重的工厂增加GDP但降低生活质量。"
    - misconception: "二手交易计入GDP"
      correction: "GDP只计算新生产的价值。二手房交易不计入，但中介服务费计入。"

level_adaptations:
  high:
    explanation: "GDP的三种核算方法：生产法、收入法、支出法。名义GDP vs 实际GDP的区别。"
    example: "为什么日本GDP增长缓慢但人均收入仍很高？人口减少导致总量停滞，但人均稳定。"
  university:
    explanation: "GDP的局限性、绿色GDP、福利经济学指标（HDI）、索洛增长模型中的GDP决定因素。"
    example: "比较GDP与GNH（国民幸福总值）：不丹为什么提出GNH？"

platform_mapping:
  game_modes:
    - mode_id: "macro_sandbox_v1"
      application: "核心指标——所有玩家的总产出构成虚拟GDP，政策目标之一"
    - mode_id: "global_trade_v1"
      application: "跨国贸易对各国GDP的影响"
  
  ai_tutor_hints:
    - trigger: "学生只关注企业利润忽视整体经济"
      hint: "从GDP的视角看，你的企业利润只是整体经济的一部分。如果所有企业都裁员保利润，消费下降反而会导致GDP萎缩，最终影响所有人。"

related_content:
  prerequisites: ["KN-EC-MI-001"]
  extensions: ["KN-EC-MA-003", "KN-EC-MA-004"]
  game_mode_applications: ["macro_sandbox_v1"]

