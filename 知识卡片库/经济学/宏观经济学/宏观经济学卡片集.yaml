content_type: KN
content_id: "KN-EC-MA-004-v1.0"
title: "货币政策与财政政策"
subtitle: "政府如何调节经济？"

target_level: "大学职校"
target_age: [18, 22]
difficulty: 5
competencies: ["SL-5", "FL-5"]
bloom_level: "evaluate"

tags: ["宏观经济", "政策", "政府", "高阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "经济学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: |
    - 货币政策：央行通过调节利率、存款准备金率、公开市场操作等手段影响货币供应量和信贷成本。
    - 财政政策：政府通过调整税收和政府支出（基建、福利等）来影响总需求。
  explanation: "货币政策像'油门和刹车'（央行控制钱的速度），财政政策像'方向盘'（政府决定钱投向哪里）。两者配合调节经济这辆大车。"
  analogy: "货币政策是中央空调（调节整个房间的温度），财政政策是局部加热器（给特定区域加热）。"
  
  examples:
    - context: "生活"
      description: "房贷利率下调（货币政策）→你更愿意买房了。政府发消费券（财政政策）→你更愿意消费了。"
    - context: "平台赛事"
      description: "在'宏观经济沙盘'中，玩家可以扮演央行行长或财政部长，制定政策影响虚拟经济。"
    - context: "现实商业"
      description: "2020年疫情：全球央行降息+量化宽松（货币政策），各国政府发钱+基建（财政政策）。"
  
  non_examples:
    - misconception: "货币政策和财政政策效果一样快"
      correction: "货币政策传导快（几个月），财政政策传导慢（建设周期）。"
    - misconception: "政府可以无限刺激经济"
      correction: "过度刺激会导致通胀、债务累积、资产泡沫。政策空间是有限的。"

level_adaptations:
  university:
    explanation: "IS-LM模型、货币传导机制、政策时滞、政策效果的不确定性、政治经济学视角。"
    example: "比较中美政策差异：美国更依赖货币政策（美联储独立），中国更依赖财政政策（政府主导投资）。"

platform_mapping:
  game_modes:
    - mode_id: "macro_sandbox_v1"
      application: "核心玩法——政策制定者vs企业经营者，体验政策如何传导到微观决策"
    - mode_id: "global_trade_v1"
      application: "不同国家的政策差异如何影响汇率和贸易"
  
  ai_tutor_hints:
    - trigger: "学生制定过于激进的宽松政策"
      hint: "大幅降息和印钞短期内刺激经济，但3-4轮后可能引发通胀和资产泡沫。政策效果有滞后性，需要考虑长期后果。"

related_content:
  prerequisites: ["KN-EC-MA-001", "KN-EC-MA-002", "KN-EC-MA-003"]
  extensions: ["KN-MG-ST-001", "KN-EC-MI-008"]
  game_mode_applications: ["macro_sandbox_v1"]
