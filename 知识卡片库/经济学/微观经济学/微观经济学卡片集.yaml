content_type: KN
content_id: "KN-EC-MI-002-v1.0"
title: "价格弹性"
subtitle: "为什么有的东西涨价没人买，有的东西涨价照样买？"

target_level: "初中及以上"
target_age: [13, 22]
difficulty: 3
competencies: ["ML-1", "ML-4"]
bloom_level: "apply"

tags: ["定价", "需求", "弹性", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "经济学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "价格弹性衡量的是：当价格变化1%时，需求量变化的百分比。弹性大意味着消费者对价格敏感，弹性小意味着不敏感。"
  explanation: "如果你涨价10%，销量下降了20%，说明弹性很大（消费者很敏感）。如果销量只下降了2%，说明弹性很小（消费者不太在意价格）。"
  analogy: "就像橡皮筋——有的橡皮筋一拉就伸长（弹性大），有的几乎拉不动（弹性小）。价格就是拉力，销量变化就是伸长量。"
  formula: "价格弹性 = (需求量变化百分比) / (价格变化百分比)"
  
  examples:
    - context: "生活"
      description: "盐涨价了，你还是得买（弹性小）。但奶茶涨价了，你可以改喝可乐（弹性大）。"
    - context: "平台赛事"
      description: "在'定价实验室'中，必需品（如基础款手机）的弹性低，奢侈品（如高端配件）的弹性高。"
    - context: "现实商业"
      description: "航空公司对商务舱和 Economy 舱采取不同定价策略——商务舱弹性低，Economy 弹性高。"
  
  non_examples:
    - misconception: "涨价一定导致收入下降"
      correction: "对于弹性小的商品，涨价反而可能增加总收入（因为销量下降不多）。"
    - misconception: "弹性是固定不变的"
      correction: "弹性会随时间、情境变化。短期弹性小（习惯难改），长期弹性大（可以找到替代品）。"

level_adaptations:
  middle:
    explanation: "有些东西涨价了你还是买（盐），有些东西涨价你就不买了（零食）。这就是'弹性'——你对价格的敏感程度。"
    example: "学校门口的奶茶从8元涨到12元，你会怎么做？如果涨到20元呢？"
  high:
    explanation: "弹性决定定价策略。弹性大的商品适合'薄利多销'，弹性小的商品可以'高价少销'。"
    example: "分析为什么游乐园门票贵但里面矿泉水更贵——门票弹性低（你已经决定了要来），矿泉水弹性高（你可以自带）。"
  university:
    explanation: "交叉弹性、收入弹性、需求弹性的决定因素（替代品、必需品、时间跨度）。定价策略中的价格歧视。"
    example: "三段定价法：为什么软件有免费版、专业版、企业版？不同用户群体的价格弹性不同。"

platform_mapping:
  game_modes:
    - mode_id: "pricing_lab_v1"
      application: "核心机制——学生通过多轮定价实验，发现不同产品的弹性差异"
    - mode_id: "turn_based_strategy_v2"
      application: "不同消费者群体的弹性不同——学生需要识别高/低弹性市场"
  
  ai_tutor_hints:
    - trigger: "学生在高弹性市场大幅涨价"
      hint: "这个市场的消费者对价格很敏感。大幅涨价可能导致销量暴跌。试试小幅涨价，观察反应。"
    - trigger: "学生在低弹性市场定低价"
      hint: "这个市场的消费者不太在意价格，更在意品质或服务。你有提价空间，同时提升体验。"

personality_mapping:
  recommended:
    - mbti: "INTP"
      reason: "喜欢分析变量之间的量化关系"
    - mbti: "ENTJ"
      reason: "善于利用规律制定定价策略"
  challenge_for:
    - mbti: "ESFP"
      adjustment: "用具体实验数据替代抽象公式，让学生自己发现规律"

multimedia:
  illustration_prompt: "一条S形的需求曲线，左侧标注'弹性大'（陡峭下降），右侧标注'弹性小'（平缓），中间有一个指针可以根据价格移动"
  short_video_prompt: "分屏对比：左边是'盐涨价'（销量几乎不变），右边是'奶茶涨价'（销量暴跌），用弹性公式动态计算"
  interactive_demo: "slider_elasticity: 学生调节价格滑块，观察销量和总收入的变化曲线"

related_content:
  prerequisites: ["KN-EC-MI-001"]
  extensions: ["KN-BS-MK-005", "KN-EC-BE-001"]
  game_mode_applications: ["pricing_lab_v1"]

