      hint: "你的价格低于成本，这意味着你在'赔本赚吆喝'。需求确实重要，但供给端（你的成本）也不能忽视。"
    - trigger: "学生在需求高的城市定价过低"
      hint: "这个城市的需求很旺盛，但你的定价却和低迷城市一样。供需关系告诉你：高需求可以支撑更高价格。"

  concept_anchors:
    - at_event: "天气突然变晴"
      display: "需求暴增！这就是供需关系在发挥作用——消费者突然更想买了。"
    - at_event: "新竞争对手进入"
      display: "供给增加了！更多的卖家意味着你需要思考：是降价竞争，还是差异化？"

personality_mapping:
  recommended:
    - mbti: "ESTJ"
      reason: "喜欢通过数据和规律理解世界"
    - mbti: "INTP"
      reason: "享受分析变量之间的关系"
  challenge_for:
