content_type: KN
content_id: "KN-EC-MI-003-v1.0"
title: "边际效用递减"
subtitle: "为什么第三个冰淇淋不如第一个好吃？"

target_level: "高中及以上"
target_age: [15, 22]
difficulty: 3
competencies: ["FL-1"]
bloom_level: "understand"

tags: ["消费", "效用", "决策", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "经济学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "在一定时间内，随着某种商品消费量的增加，每多消费一单位所带来的满足感（效用）会逐渐减少。"
  explanation: "第一杯奶茶带给你很大的快乐，第二杯还不错，第三杯你开始觉得腻了，第四杯你可能喝不下去了。"
  analogy: "就像往杯子里倒果汁——第一口最解渴，喝到后面每一口的满足感都在下降。"
  
  examples:
    - context: "生活"
      description: "玩游戏的第一个小时最开心，玩到第五个小时就开始累了。"
    - context: "平台赛事"
      description: "在'回合制策略'中，连续多轮在同一城市投入品牌展示，后期的边际效果会递减。"
    - context: "现实商业"
      description: "广告投入也有边际递减——第一家店投广告效果很好，但当所有店都投广告时，效果就被稀释了。"
  
  non_examples:
    - misconception: "边际效用递减意味着总效用也在减少"
      correction: "总效用还在增加，只是增加的速度变慢了。只有边际效用变为负数时，总效用才会下降。"
    - misconception: "所有商品都严格遵循边际效用递减"
      correction: "有些商品（如收藏品、网络效应产品）可能不遵循，甚至递增。"

level_adaptations:
  middle:
    explanation: "吃第一个汉堡很香，吃第二个还行，吃第三个就撑了。每多吃一个，带来的满足感都在减少。"
    example: "在'创业生存战'中，连续多轮投入同一项能力，后期的提升效果越来越小。"
  high:
    explanation: "边际效用递减解释了为什么'多样化'比'单一化'更好——把钱花在不同的东西上，总满足感更高。"
    example: "企业在多个城市的投入分配：如果所有预算都投一个城市，后期效果递减；分散投资可能总回报更高。"
  university:
    explanation: "边际分析是经济学决策的核心：MR=MC 法则。边际收益等于边际成本时的产量是最优的。"
    example: "为什么科技公司最后会裁员？因为新增员工的边际产出已经低于其成本。"

platform_mapping:
  game_modes:
    - mode_id: "turn_based_strategy_v2"
      application: "同一属性的连续投入会边际递减——学生需要分散投资或寻找新市场"
    - mode_id: "slow_company_challenge_v1"
      application: "长期投入中，边际递减迫使学生在'深耕'和'拓展'之间做选择"
  
  ai_tutor_hints:
    - trigger: "学生连续3轮在同一城市投入同一属性>80%"
      hint: "你连续多轮在同一属性上大量投入。注意'边际效用递减'——后期的每一分钱带来的回报可能不如前期。考虑分散投资或开拓新市场。"

personality_mapping:
  recommended:
    - mbti: "INTJ"
      reason: "善于在系统中发现规律和最优解"
  challenge_for:
    - mbti: "ISTJ"
      adjustment: "强调'坚持'也有边界，适时转变不是放弃而是策略"

multimedia:
  illustration_prompt: "一个快乐表情在吃冰淇淋：第一个冰淇淋表情超开心，第二个微笑，第三个面无表情，第四个皱眉。上方有一条向下的曲线标注'满足感'"
  interactive_demo: "slider_diminishing: 学生调节同一属性的投入量，观察边际回报的变化曲线"

