content_type: KN
content_id: "KN-EC-MI-005-v1.0"
title: "市场结构"
subtitle: "从街头小店到科技巨头——市场格局决定游戏规则"

target_level: "高中及以上"
target_age: [15, 22]
difficulty: 4
competencies: ["ML-3", "SL-1"]
bloom_level: "analyze"

tags: ["竞争", "市场", "策略", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "经济学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "市场结构描述了一个市场中企业的数量、产品差异程度、进入壁垒等因素，主要分为完全竞争、垄断竞争、寡头和垄断四种。"
  explanation: |
    - 完全竞争：很多小卖家，卖的东西都一样（如菜市场）
    - 垄断竞争：很多卖家，产品有点不同（如奶茶店）
    - 寡头：少数几个大卖家（如手机行业：苹果、三星、华为）
    - 垄断：只有一个卖家（如过去的电话公司）
  analogy: "就像运动会：完全竞争是百米赛跑（所有人跑一样的距离），垄断竞争是花样滑冰（每个人都有自己的动作），寡头是篮球决赛（两队对抗），垄断是裁判（只有他能吹哨）。"
  
  examples:
    - context: "生活"
      description: "学校门口的奶茶店是垄断竞争——很多家，但每家的口味和风格不同。"
    - context: "平台赛事"
      description: "在'小镇集市'中，初期是垄断竞争（各摊位差异化），后期可能演变为寡头（两三家主导）。"
    - context: "现实商业"
      description: "搜索引擎市场接近垄断（谷歌/百度），社交平台是寡头（微信、抖音、微博）。"
  
  non_examples:
    - misconception: "垄断一定对消费者有害"
      correction: "自然垄断（如电网）可能比多个竞争者更高效。关键看是否存在垄断利润和创新的抑制。"

level_adaptations:
  high:
    explanation: "四种市场结构的区别：卖家数量、产品差异、价格控制力、进入壁垒。"
    example: "分析为什么奶茶店可以定价不同，但加油站的价格几乎一样？"
  university:
    explanation: "博弈论视角下的市场结构分析、市场集中度指标（HHI）、反垄断政策的经济学基础。"
    example: "平台经济中的'赢家通吃'：为什么互联网公司容易形成垄断？"

platform_mapping:
  game_modes:
    - mode_id: "market_fair_v1"
      application: "初期模拟完全竞争/垄断竞争，引入差异化后演变为寡头"
    - mode_id: "turn_based_strategy_v2"
      application: "多队伍竞争的市场结构分析——何时合作（寡头共谋）何时竞争"
  
  ai_tutor_hints:
    - trigger: "市场只有2-3个主要竞争者"
      hint: "这个市场正在从'充分竞争'演变为'寡头格局'。在寡头市场中，你的决策会强烈影响对手，对手也会强烈影响你。考虑博弈思维！"

related_content:
  prerequisites: ["KN-EC-MI-001"]
  extensions: ["KN-EC-MI-006", "KN-MG-ST-002"]
  game_mode_applications: ["market_fair_v1", "turn_based_strategy_v2"]

---
content_type: KN
content_id: "KN-EC-MI-006-v1.0"
title: "纳什均衡"
subtitle: "当所有人都做了对自己最好的选择，结果会怎样？"

target_level: "高中及以上"
target_age: [16, 22]
difficulty: 5
competencies: ["SL-1", "SL-2"]
bloom_level: "analyze"

tags: ["博弈论", "策略", "均衡", "高阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "经济学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "在博弈中，纳什均衡是指一个策略组合：在这个组合下，任何参与者单方面改变自己的策略都无法获得更好的结果。"
  explanation: "就像堵车：如果所有人都走同一条路（均衡），虽然都很慢，但任何一个人单独换路可能更慢。所以大家都'卡住'了。"
  analogy: "电影院里所有人都站着看电影（纳什均衡）——虽然大家都很累，但没人敢先坐下（因为坐下就看不到了）。"
  
  examples:
    - context: "生活"
      description: "学校里的'军备竞赛'：所有人都在补课，虽然大家都很累，但没人敢先停下来。"
    - context: "平台赛事"
      description: "在'回合制策略'中，如果所有队伍都选择 TECH 路线，即使 BRAND 路线更好，也没人敢先切换——这就是纳什均衡的'陷阱'。"
    - context: "现实商业"
      description: "价格战：两家企业都降价到成本线，虽然利润微薄，但谁先涨价谁丢市场。"
  
  non_examples:
    - misconception: "纳什均衡一定是最优结果"
      correction: "纳什均衡只是'稳定'的结果，不一定是'最好'的结果。囚徒困境就是最好的反例。"

level_adaptations:
  high:
    explanation: "纳什均衡是一种'稳定状态'——在给定他人选择的情况下，你没有动力改变自己的选择。"
    example: "分析'回合制策略'中的路线选择：如果所有人都选 TECH，这就是一种纳什均衡（虽然可能不是最优）。"
  university:
    explanation: "纳什均衡的存在性、多重均衡的选择、颤抖手完美均衡、演化博弈论。"
    example: "平台竞争中的'补贴大战'：为什么共享单车最后只剩一两家？"

platform_mapping:
  game_modes:
    - mode_id: "turn_based_strategy_v2"
      application: "多轮策略博弈中识别和打破纳什均衡陷阱"
    - mode_id: "prisoners_dilemma_v1"
      application: "囚徒困境是纳什均衡的经典案例——双方都不合作是均衡，但合作对双方更好"
  
  ai_tutor_hints:
    - trigger: "超过60%队伍选择同一路线"
      hint: "市场似乎陷入了一个纳什均衡——大家都挤在同一条路上。但要注意：均衡不等于最优。有时候，率先打破均衡的人能获得超额回报。"

related_content:
  prerequisites: ["KN-EC-MI-005"]
  extensions: ["KN-EC-MI-007", "KN-MG-ST-003"]
  game_mode_applications: ["turn_based_strategy_v2", "prisoners_dilemma_v1"]

---
content_type: KN
content_id: "KN-EC-MI-007-v1.0"
title: "囚徒困境"
subtitle: "为什么聪明人也会做蠢事？"

target_level: "高中及以上"
target_age: [15, 22]
difficulty: 4
competencies: ["SL-1", "EL-1"]
bloom_level: "evaluate"

tags: ["博弈论", "合作", "信任", "经典概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "经济学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "两个被捕的囚徒，如果都保持沉默（合作），两人各判1年；如果一人背叛、一人沉默，背叛者释放、沉默者判10年；如果都背叛，各判5年。理性选择导致双方都背叛——结果比合作更差。"
  explanation: "每个人都想'不管对方怎么选，背叛对我更有利'。但当两个人都这么想时，结果比合作糟糕得多。"
  analogy: "就像周末大扫除：如果两人都干活，家里干净（各付出中等 effort）。如果一人偷懒、一人干活，偷懒者轻松、干活者累死。如果两人都偷懒，家里脏乱。结果：两人都选择偷懒。"
  
  examples:
    - context: "生活"
      description: "小组作业：如果都努力，成绩好；如果一人偷懒，偷懒者轻松得同样分数。结果：大家倾向于偷懒。"
    - context: "平台赛事"
      description: "在'拍卖交易大厅'中，如果竞拍者串通压低价格（合作），大家都能获利。但每个人都有动机偷偷出高价（背叛）。"
    - context: "现实商业"
      description: "OPEC产油国协议减产：大家都同意减产保价，但每个国家都有动机偷偷多产。"
  
  non_examples:
    - misconception: "囚徒困境说明人不应该合作"
      correction: "恰恰相反——它说明合作很难但需要机制设计（如重复博弈、惩罚机制）来维持。"
    - misconception: "囚徒困境只在两人之间存在"
      correction: "多人囚徒困境（公地悲剧）更常见——污染、过度捕捞都是变体。"

level_adaptations:
  high:
    explanation: "囚徒困境的核心悖论：个体理性导致集体非理性。打破困境的方法：重复博弈、建立信任、引入惩罚机制。"
    example: "分析'产业链角色扮演'中的合作与背叛：为什么口头协议容易破裂？合同如何改变博弈结构？"
  university:
    explanation: "重复囚徒困境（Axelrod锦标赛）、演化稳定策略、机制设计理论、公共品博弈。"
    example: "区块链技术如何通过'不可篡改的记录'解决囚徒困境中的信任问题？"

platform_mapping:
  game_modes:
    - mode_id: "prisoners_dilemma_v1"
      application: "核心机制——让学生亲身体验合作与背叛的张力"
    - mode_id: "supply_chain_rpg_v1"
      application: "产业链上下游的信任与背叛——合同如何改变博弈"
    - mode_id: "turn_based_strategy_v2"
      application: "联盟机制的设计——如何维持合作而不被背叛"
  
  ai_tutor_hints:
    - trigger: "学生在联盟中被背叛"
      hint: "你经历了囚徒困境的'背叛面'。在现实商业中，信任很宝贵但也很脆弱。思考：什么样的机制可以让合作更稳定？（如合同、重复博弈、声誉系统）"
    - trigger: "学生连续多轮选择合作"
      hint: "你的合作精神值得赞赏！但在一次性博弈中，合作可能被利用。如果这是重复博弈，'以牙还牙'策略可能是更好的选择。"

related_content:
  prerequisites: ["KN-EC-MI-006"]
  extensions: ["KN-EC-MI-008", "KN-MG-ET-001"]
  game_mode_applications: ["prisoners_dilemma_v1", "supply_chain_rpg_v1"]

