  short_video_prompt: "动画展示 lemonade 摊位：晴天时排队的人多，价格从2元涨到4元；雨天时没人，价格降到1元。用简单的供需曲线叠加展示。"
  interactive_demo: "drag_drop_supply_demand: 学生拖拽供给/需求曲线，观察均衡价格变化"

