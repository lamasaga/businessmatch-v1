content_type: KN
content_id: "KN-EC-MI-001-v1.0"
title: "供需关系"
subtitle: "为什么价格会涨涨跌跌？"

target_level: "通用"
target_age: [10, 22]
difficulty: 1
competencies: ["ML-1"]
bloom_level: "understand"

tags: ["定价", "市场", "基础概念", "入门"]
ai_generable: true
author: "平台教研团队"
reviewer: "经济学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "商品的价格由市场上供给方愿意出售的数量和需求方愿意购买的数量共同决定。"
  explanation: "当很多人想买某样东西（需求高），但卖的人很少（供给少），价格就会上涨。反过来，如果卖的人很多但没人买，价格就会下降。"
  analogy: "就像跷跷板：一头是'想买的人'，一头是'想卖的人'。哪边重，价格就往哪边倾斜。"
  
  examples:
    - context: "生活"
      description: "暑假冰淇淋涨价——天热大家都想吃（需求增加），但店铺数量没变（供给不变），所以涨价。"
    - context: "平台赛事"
      description: "在'小镇集市'中，晴天时 lemonade 需求大增，如果你提前备货就能卖更多；但如果所有摊位都备货，竞争会导致价格下降。"
    - context: "现实商业"
      description: "疫情期间口罩价格暴涨——需求暴增而供给跟不上。"
  
  non_examples:
    - misconception: "成本决定价格"
      correction: "成本影响供给，但不直接决定价格。即使成本很低，如果没人买，价格也上不去。"
    - misconception: "价格由卖家随意决定"
      correction: "卖家可以标价，但如果价格太高没人买，最终还是要降下来。"

# 学段适配
level_adaptations:
  primary:
    explanation: "想要的人多，东西就贵；想要的人少，东西就便宜。"
    example: "学校门口的奶茶，放学时排队人多就会涨价，上午没人时就有折扣。"
  middle:
    explanation: "需求曲线和供给曲线的交点决定均衡价格。当需求增加（曲线右移），均衡价格上升。"
    example: "用图表展示：冰淇淋在夏天需求曲线如何右移。"
  high:
    explanation: "供需弹性、市场出清、价格管制（最高限价/最低限价）对市场效率的影响。"
    example: "分析房租管制政策：房东为什么不愿意出租？"
  university:
    explanation: "一般均衡理论、拍卖理论中的供需机制、信息不对称对价格发现的影响。"
    example: "双边市场中的平台定价：Uber如何平衡司机供给和乘客需求？"

# 平台映射
platform_mapping:
  game_modes:
    - mode_id: "market_fair_v1"
      application: "核心机制——天气事件改变需求，学生根据供需调整产量和价格"
    - mode_id: "auction_trading_v1"
      application: "拍卖是价格发现机制，让学生亲身体验'市场出清'"
    - mode_id: "turn_based_strategy_v2"
      application: "不同城市的市场需求差异——学生需要分析各城市的供需特征"
  
  ai_tutor_hints:
