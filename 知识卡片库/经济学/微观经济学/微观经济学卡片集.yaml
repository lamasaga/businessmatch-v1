content_type: KN
content_id: "KN-EC-MI-008-v1.0"
title: "外部性"
subtitle: "你的行为，悄悄影响着别人"

target_level: "高中及以上"
target_age: [15, 22]
difficulty: 3
competencies: ["EL-2", "EL-3", "ML-1"]
bloom_level: "analyze"

tags: ["社会", "环境", "成本", "进阶概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "经济学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "当一个人的行为对旁观者产生影响，而这种影响又没有通过市场价格反映出来时，就存在外部性。正外部性带来社会收益，负外部性带来社会成本。"
  explanation: "工厂排污赚钱（自己的收益），但污染了河流（别人的成本）。这种'别人的成本'就是负外部性。"
  analogy: "就像宿舍里有人放音乐：他自己很开心（私人收益），但室友无法安静学习（外部成本）。"
  
  examples:
    - context: "生活"
      description: "接种疫苗：你自己不得病（私人收益），也减少了传染病传播（正外部性）。"
    - context: "平台赛事"
      description: "在'ESG可持续经营'中，企业减少碳排放有成本（私人成本），但全社会受益（正外部性）。"
    - context: "现实商业"
      description: "科技公司的数据隐私问题：公司用数据盈利，但用户隐私受损——负外部性。"
  
  non_examples:
    - misconception: "所有社会影响都是外部性"
      correction: "只有通过市场交易能解决的才不是外部性。如果已经通过税收或补贴内部化了，就不再是外部性。"
    - misconception: "外部性只存在于环境污染"
      correction: "教育、研发、疫苗都有正外部性；噪音、拥堵都有负外部性。"

level_adaptations:
  high:
    explanation: "外部性导致市场失灵：私人成本/收益与社会成本/收益不一致。解决办法：税收（庇古税）、补贴、产权界定（科斯定理）。"
    example: "为什么塑料袋要收费？因为免费时商家和消费者都不考虑环境成本（负外部性），收费后成本被'内部化'了。"
  university:
    explanation: "科斯定理、产权经济学、公共选择理论、环境经济学中的最优污染水平。"
    example: "碳交易市场如何通过价格机制将外部性内部化？"

platform_mapping:
  game_modes:
    - mode_id: "esg_scoring_v1"
      application: "核心机制——ESG投入的正外部性如何影响企业长期价值"
    - mode_id: "macro_sandbox_v1"
      application: "环境政策对企业决策的外部性影响"
  
  ai_tutor_hints:
    - trigger: "学生为降低成本而忽视ESG投入"
      hint: "你降低了成本，但产生了负外部性。在ESG评分系统中，这些外部成本最终会影响你的企业声誉和长期利润。"

related_content:
  prerequisites: ["KN-EC-MI-001"]
  extensions: ["KN-MG-ET-001", "KN-MG-ET-002"]
  game_mode_applications: ["esg_scoring_v1", "macro_sandbox_v1"]
