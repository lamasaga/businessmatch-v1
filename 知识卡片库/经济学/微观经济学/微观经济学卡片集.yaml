content_type: KN
content_id: "KN-EC-MI-004-v1.0"
title: "机会成本"
subtitle: "选择A的代价，是你放弃了的B"

target_level: "初中及以上"
target_age: [13, 22]
difficulty: 2
competencies: ["FL-1", "SL-2"]
bloom_level: "understand"

tags: ["决策", "成本", "权衡", "基础概念"]
ai_generable: true
author: "平台教研团队"
reviewer: "经济学顾问"
version: "1.0.0"
created_at: "2026-05-12"
updated_at: "2026-05-12"

knowledge:
  definition: "为了得到某种东西而必须放弃的其他东西中价值最高的那个，就是机会成本。"
  explanation: "你有一个小时，可以用来学习、打游戏、或者睡觉。如果你选择学习，机会成本就是'打游戏或睡觉中能带给你最大价值的那一个'。"
  analogy: "就像你有10元钱，买了奶茶就不能买汉堡。奶茶的机会成本就是那个你没买到的汉堡（假设汉堡是你第二想要的东西）。"
  
  examples:
    - context: "生活"
      description: "大学生选择考研的机会成本是三年的工作经验和收入。"
    - context: "平台赛事"
      description: "在'回合制策略'中，把预算投入 TECH 的机会成本是放弃了 BRAND 或 USER 可能带来的回报。"
    - context: "现实商业"
      description: "公司决定自建工厂的机会成本是：如果把钱用来研发新产品，可能获得的收益。"
  
  non_examples:
    - misconception: "机会成本就是会计成本"
      correction: "会计成本是实际花的钱，机会成本是放弃的潜在收益。两者完全不同。"
    - misconception: "没选的那个选项的价值就是机会成本"
      correction: "是所有放弃选项中价值最高的那个，不是随便一个。"

level_adaptations:
  middle:
    explanation: "你花时间做A，就不能做B。机会成本就是你放弃的B。"
    example: "周末你有2小时，可以写作业或打篮球。如果你选择打篮球，机会成本就是'完成作业带来的安心感'。"
  high:
    explanation: "机会成本是决策的核心。理性人比较的是边际收益和机会成本，而不是沉没成本。"
    example: "企业决定是否继续一个亏损项目：考虑的不是已经投了多少钱（沉没成本），而是继续投入的边际收益是否大于机会成本。"
  university:
    explanation: "机会成本在资源配置、投资决策、政策评估中的应用。比较优势理论的基础。"
    example: "为什么医生不应该自己修电脑？因为医生一小时的机会成本（看病收入）远高于请IT人员的费用。"

platform_mapping:
  game_modes:
    - mode_id: "turn_based_strategy_v2"
      application: "每条路线的选择都有机会成本——投入A意味着放弃B的潜在回报"
    - mode_id: "startup_survival_v1"
      application: "有限的现金流如何分配？每个决策都涉及机会成本权衡"
  
  ai_tutor_hints:
    - trigger: "学生在某城市投入100%预算"
      hint: "你把所有预算都投在了这里。机会成本的视角：如果这些预算的一部分投到另一个城市，会不会获得更高的总回报？"

personality_mapping:
  recommended:
    - mbti: "INTJ"
      reason: "天然思考'如果...会怎样'的替代方案"
    - mbti: "ENTJ"
      reason: "善于在资源约束下做权衡决策"

multimedia:
  illustration_prompt: "一个岔路口，左边路标'A'通向奶茶，右边路标'B'通向汉堡。人物站在路口，脚下有一个影子指向B（暗示机会成本）。风格：卡通插画"
  interactive_demo: "choice_opportunity_cost: 学生做出选择后，系统自动展示'你放弃了什么'及其潜在价值"

related_content:
  prerequisites: []
  extensions: ["KN-EC-MI-003", "KN-MG-ST-002"]
  game_mode_applications: ["turn_based_strategy_v2", "startup_survival_v1"]

