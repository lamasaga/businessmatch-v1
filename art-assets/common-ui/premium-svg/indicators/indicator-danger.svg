<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Danger indicator</title>
  <desc id="desc">Reusable SVG status indicator for failed actions, blocked states, penalties, and severe losses.</desc>
  <defs>
    <linearGradient id="idg_fill" x1="32" y1="28" x2="127" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fca5a5"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="idg_shadow" x="14" y="14" width="132" height="132" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#7f1d1d" flood-opacity="0.32"/>
    </filter>
  </defs>
  <circle cx="80" cy="80" r="56" fill="url(#idg_fill)" filter="url(#idg_shadow)"/>
  <circle cx="80" cy="80" r="43" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.48"/>
  <path d="M58 58l44 44M102 58l-44 44" stroke="#450a0a" stroke-width="12" stroke-linecap="round"/>
</svg>
