<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Info indicator</title>
  <desc id="desc">Reusable SVG status indicator for notes, hints, phase explanations, and neutral system feedback.</desc>
  <defs>
    <linearGradient id="iif_fill" x1="32" y1="28" x2="127" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="iif_shadow" x="14" y="14" width="132" height="132" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#172554" flood-opacity="0.30"/>
    </filter>
  </defs>
  <circle cx="80" cy="80" r="56" fill="url(#iif_fill)" filter="url(#iif_shadow)"/>
  <circle cx="80" cy="80" r="43" fill="none" stroke="#dbeafe" stroke-width="5" stroke-opacity="0.62"/>
  <path d="M80 75v39M80 48h.1" stroke="#eff6ff" stroke-width="13" stroke-linecap="round"/>
</svg>
