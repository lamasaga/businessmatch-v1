<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Warning indicator</title>
  <desc id="desc">Reusable SVG status indicator for risks, urgent events, resource shortages, and auction warnings.</desc>
  <defs>
    <linearGradient id="iw_fill" x1="37" y1="27" x2="124" y2="134" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="iw_shadow" x="14" y="14" width="132" height="132" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#78350f" flood-opacity="0.30"/>
    </filter>
  </defs>
  <path d="M80 25l61 106H19z" fill="url(#iw_fill)" filter="url(#iw_shadow)" stroke="#fef3c7" stroke-width="5" stroke-linejoin="round"/>
  <path d="M80 61v35M80 116h.1" stroke="#431407" stroke-width="13" stroke-linecap="round"/>
</svg>
