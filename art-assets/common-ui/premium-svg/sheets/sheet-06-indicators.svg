<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Status indicator sheet</title>
  <desc id="desc">Four premium SVG status indicators for success, warning, danger, and information states.</desc>
  <rect width="900" height="900" fill="#0a0d12"/>
  <g font-family="Inter, Microsoft YaHei, Arial, sans-serif" fill="#e2e8f0">
    <g transform="translate(80 80)">
      <rect width="320" height="320" rx="24" fill="#111820" stroke="#334155"/>
      <image href="../indicators/indicator-success.svg" x="80" y="52" width="160" height="160"/>
      <text x="160" y="252" text-anchor="middle" font-size="24" font-weight="700">indicator-success</text>
    </g>
    <g transform="translate(500 80)">
      <rect width="320" height="320" rx="24" fill="#111820" stroke="#334155"/>
      <image href="../indicators/indicator-warning.svg" x="80" y="52" width="160" height="160"/>
      <text x="160" y="252" text-anchor="middle" font-size="24" font-weight="700">indicator-warning</text>
    </g>
    <g transform="translate(80 500)">
      <rect width="320" height="320" rx="24" fill="#111820" stroke="#334155"/>
      <image href="../indicators/indicator-danger.svg" x="80" y="52" width="160" height="160"/>
      <text x="160" y="252" text-anchor="middle" font-size="24" font-weight="700">indicator-danger</text>
    </g>
    <g transform="translate(500 500)">
      <rect width="320" height="320" rx="24" fill="#111820" stroke="#334155"/>
      <image href="../indicators/indicator-info.svg" x="80" y="52" width="160" height="160"/>
      <text x="160" y="252" text-anchor="middle" font-size="24" font-weight="700">indicator-info</text>
    </g>
  </g>
</svg>
