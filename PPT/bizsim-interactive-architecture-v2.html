<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商识唯智 · 项目结构与数据流转</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Hiragino Sans GB", sans-serif;
      background: #f8fafc;
      color: #1e293b;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 20px 40px 12px;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
    }
    .header p {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }
    .diagram-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 40px 40px;
      position: relative;
    }
    svg {
      width: 100%;
      height: 100%;
      max-width: 1920px;
      max-height: 860px;
    }

    #tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      background: #0f172a;
      color: #f8fafc;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
      max-width: 320px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    #tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }
    #tooltip .tt-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 4px;
      color: #fff;
    }
    #tooltip .tt-desc {
      color: #cbd5e1;
    }
    #tooltip .tt-flow {
      color: #38bdf8;
      font-weight: 500;
    }

    .layer-bg {
      fill: #f1f5f9;
      stroke: #e2e8f0;
      stroke-width: 1;
    }
    .node {
      cursor: pointer;
    }
    .node-bg {
      fill: #fff;
      stroke: #cbd5e1;
      stroke-width: 1;
      transition: all 0.2s ease;
    }
    .node:hover .node-bg {
      stroke: #1e3a5f;
      stroke-width: 2;
      filter: drop-shadow(0 6px 20px rgba(30,58,95,0.12));
    }
    .engine-layer .node-bg {
      fill: #f8fafc;
      stroke: #94a3b8;
      stroke-width: 1.5;
    }
    .node-title {
      font-size: 18px;
      font-weight: 700;
      fill: #0f172a;
      pointer-events: none;
    }
    .layer-title {
      font-size: 11px;
      font-weight: 600;
      fill: #94a3b8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      pointer-events: none;
    }
    .ai-badge {
      fill: #f3e8ff;
      stroke: #7c3aed;
      stroke-width: 1;
      pointer-events: none;
    }
    .ai-badge-text {
      font-size: 9px;
      font-weight: 700;
      fill: #6b21a8;
      pointer-events: none;
    }
    .tech-note {
      fill: #f1f5f9;
      stroke: #cbd5e1;
      stroke-width: 1;
      pointer-events: none;
    }
    .tech-note-text {
      font-size: 11px;
      fill: #475569;
      font-weight: 500;
      pointer-events: none;
    }
    .flow-line {
      fill: none;
      stroke: #94a3b8;
      stroke-width: 1.5;
      stroke-dasharray: 5,4;
      opacity: 0.4;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .flow-line:hover,
    .flow-line.active {
      stroke: #1e3a5f;
      stroke-width: 3;
      opacity: 1;
    }
    .flow-line.ai-flow {
      stroke: #7c3aed;
      opacity: 0.55;
    }
    .flow-line.ai-flow:hover,
    .flow-line.ai-flow.active {
      stroke: #5b21b6;
      opacity: 1;
    }
    .legend {
      position: absolute;
      bottom: 24px;
      left: 40px;
      display: flex;
      gap: 24px;
      font-size: 12px;
      color: #64748b;
      background: rgba(255,255,255,0.9);
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-line {
      width: 24px;
      height: 2px;
      background: #94a3b8;
    }
    .legend-line.ai {
      background: #7c3aed;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #7c3aed;
    }
  </style>
</head>

  <div id="tooltip"></div>

  <script>
    const tooltip = document.getElementById('tooltip');
    const nodes = document.querySelectorAll('.node');
    const flowLines = document.querySelectorAll('.flow-line');

    function showTooltip(html, x, y) {
      tooltip.innerHTML = html;
      tooltip.style.left = x + 16 + 'px';
      tooltip.style.top = y + 16 + 'px';
      tooltip.classList.add('visible');

      const rect = tooltip.getBoundingClientRect();
      if (rect.right > window.innerWidth - 20) {
        tooltip.style.left = (x - rect.width - 16) + 'px';
      }
      if (rect.bottom > window.innerHeight - 20) {
        tooltip.style.top = (y - rect.height - 16) + 'px';
      }
    }

    function hideTooltip() {
      tooltip.classList.remove('visible');
    }

    function highlightLines(ids, highlight) {
      if (!ids) return;
      ids.split(',').forEach(id => {
        const line = document.getElementById(id.trim());
        if (line) {
          if (highlight) {
            line.classList.add('active');
            line.setAttribute('marker-end', line.classList.contains('ai-flow') ? 'url(#arrowAIHover)' : 'url(#arrowGrayHover)');
          } else {
            line.classList.remove('active');
            line.setAttribute('marker-end', line.classList.contains('ai-flow') ? 'url(#arrowAI)' : 'url(#arrowGray)');
          }
        }
      });
    }

    nodes.forEach(node => {
      const rawTooltip = node.dataset.tooltip;
      const connections = node.dataset.connections;

      node.addEventListener('mouseenter', (e) => {
        if (rawTooltip) {
          const [title, subtitle, desc] = rawTooltip.split('|');
          const html = `<div class="tt-title">${title}</div><div class="tt-desc" style="color:#94a3b8;font-size:11px;margin-bottom:6px;">${subtitle}</div><div class="tt-desc">${desc}</div>`;
          showTooltip(html, e.clientX, e.clientY);
        }
        highlightLines(connections, true);
      });

      node.addEventListener('mousemove', (e) => {
        if (!rawTooltip) return;
        const rect = tooltip.getBoundingClientRect();
        let x = e.clientX + 16;
        let y = e.clientY + 16;
        if (x + rect.width > window.innerWidth - 20) x = e.clientX - rect.width - 16;
        if (y + rect.height > window.innerHeight - 20) y = e.clientY - rect.height - 16;
        tooltip.style.left = x + 'px';
        tooltip.style.top = y + 'px';
      });

      node.addEventListener('mouseleave', () => {
        hideTooltip();
        highlightLines(connections, false);
      });
    });

    flowLines.forEach(line => {
      const raw = line.dataset.flow;
      if (!raw) return;
      const [title, content] = raw.split('|');

      line.addEventListener('mouseenter', () => {
        line.setAttribute('marker-end', line.classList.contains('ai-flow') ? 'url(#arrowAIHover)' : 'url(#arrowGrayHover)');
        const svg = document.querySelector('svg');
        const len = line.getTotalLength();
        const mid = line.getPointAtLength(len / 2);
        const svgPoint = svg.createSVGPoint();
        svgPoint.x = mid.x;
        svgPoint.y = mid.y;
        const screenPoint = svgPoint.matrixTransform(line.getScreenCTM());

        const html = `<div class="tt-flow">${title}</div><div class="tt-desc" style="margin-top:4px;">${content}</div>`;
        showTooltip(html, screenPoint.x, screenPoint.y);
      });

      line.addEventListener('mouseleave', () => {
        if (!line.classList.contains('active')) {
          line.setAttribute('marker-end', line.classList.contains('ai-flow') ? 'url(#arrowAI)' : 'url(#arrowGray)');
        }
        hideTooltip();
      });
    });
  </script>
</body>
</html>
