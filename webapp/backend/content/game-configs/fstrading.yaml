# CyberCore 赛制包 — FStrading（即时物流商战 · 唯一 trading 配置）
id: fstrading
engine: trading
design_mode: standalone
version: "3.0.0"
meta:
  name: FStrading
  description: 5 秒 tick 即时商战；长三角六城；城市参数来自 content/world/yangtze_6
  theme: fstrading
  world_region_id: yangtze_6
  world_pack_version: "0.1.2"
  education_focus:
    - 地域产业结构与供需结构
    - 运输时间的机会成本
    - 仓储约束与运力投资
    - 买卖价差与市场池吸收

defaults:
  mode: rts
  tick_interval_sec: 5
  duration_preset: standard
  duration_presets:
    short:
      label: 快速局
      minutes: 8
      total_ticks: 96
    standard:
      label: 标准局
      minutes: 10
      total_ticks: 120
    long:
      label: 完整局
      minutes: 12
      total_ticks: 144
    classroom:
      label: 课堂局
      minutes: 20
      total_ticks: 240
  warmup_ticks: 6
  initial_capital: 50000
  storage_capacity_base: 99
  max_vehicles_per_player: 3
  practice_ai_count: 3
  practice_ai_slots:
    - chaotic
    - advanced
    - advanced
  ai_levels:
    chaotic:
      name: 混乱型
      description: 高随机、常本地贵买贱卖，市场波动大但威胁较低
    advanced:
      name: 精英型
      description: 跨城 bid/ask 套利、产销地采购、高消费城出货

  ai_strategies:
    chaotic:
      name: 混乱型
      description: 高随机、非理性行为，模拟市场噪音
      behavior:
        type: random
        params:
          irrationality: 0.8
      decision_weights:
        buy: 0.30
        sell: 0.25
        move: 0.25
        hold: 0.20

    advanced:
      name: 套利型
      description: 寻找跨城价差，低买高卖
      behavior:
        type: arbitrage
        params:
          min_spread_ratio: 0.15
          max_inventory_ratio: 0.3
          risk_appetite: 0.7
      decision_weights:
        buy: 0.35
        sell: 0.35
        move: 0.25
        hold: 0.05

    hoarder:
      name: 囤积型
      description: 低价大量买入，等待涨价后抛售
      behavior:
        type: value_hoarding
        params:
          buy_threshold: 0.85
          sell_threshold: 1.35
          target_products: [grain, produce, raw_materials]
          max_single_buy_ratio: 0.25
      decision_weights:
        buy: 0.45
        sell: 0.20
        move: 0.15
        hold: 0.20

    momentum:
      name: 趋势型
      description: 追涨杀跌，跟随价格趋势
      behavior:
        type: momentum
        params:
          trend_window: 3
          momentum_threshold: 0.08
          contrarian: false
      decision_weights:
        buy: 0.35
        sell: 0.30
        move: 0.15
        hold: 0.20

    conservative:
      name: 保守型
      description: 稳健经营，避免大风险
      behavior:
        type: conservative
        params:
          max_single_trade_ratio: 0.1
          cash_reserve_ratio: 0.5
          min_profit_margin: 0.2
      decision_weights:
        buy: 0.20
        sell: 0.25
        move: 0.15
        hold: 0.40

  pricing:
    mode: pool_ask_bid
    min_spread: 0.08
    # 8 人局：价格对“缺货/囤货”更敏感，但城市不会在前 10 tick 快速断供
    elasticity: 0.28
    reference_pool: 400
    absorption_cap_per_tick: 40
    # 自然供需流量缩放（prod-cons）每 tick 只推进一小步，避免 5s tick 把城市池抽干
    natural_flow_scale: 0.20
    # 均值回归：池子偏离 target_pool 时，会缓慢拉回（防长期为 0）
    pool_reversion_rate: 0.03
    # 最低库存（按 target_pool 比例），避免出现“池为 0 但价格几乎不动”的反直觉体验
    min_pool_ratio: 0.12
  logistics:
    min_travel_ticks: 2
    move_cost_per_edge: 800
  world:
    region_id: yangtze_6
    behavior_pack: default_yrd
  # 地理资源见 content/world/geo/yangtze_6/ · API GET /trading/regions/yangtze_6/geo-pack
  products:
    - grain
    - produce
    - raw_materials
    - energy
    - furniture
    - textile
    - daily_goods
    - appliances
    - passenger_car
    - luxury

products:
  grain:
    name: 粮食
    category: staple
    volume: 1
    base_price: 18
    price_range: [8, 45]
    chain: upstream
  produce:
    name: 生鲜
    category: staple
    volume: 1
    base_price: 22
    price_range: [10, 55]
    chain: upstream
    spoil_pressure: 1.15
  raw_materials:
    name: 原材料
    category: industrial_input
    volume: 4
    base_price: 120
    price_range: [60, 220]
    chain: upstream
  energy:
    name: 能源
    category: industrial_input
    volume: 4
    base_price: 95
    price_range: [45, 180]
    chain: upstream
  furniture:
    name: 家具
    category: industrial_output
    volume: 4
    base_price: 380
    price_range: [180, 720]
    chain: midstream
  textile:
    name: 纺织品
    category: industrial_output
    volume: 4
    base_price: 280
    price_range: [140, 580]
    chain: midstream
  daily_goods:
    name: 日用品
    category: consumer_mass
    volume: 2
    base_price: 45
    price_range: [22, 95]
    chain: downstream
  appliances:
    name: 家电
    category: consumer_durable
    volume: 6
    base_price: 1200
    price_range: [650, 2400]
    chain: downstream
  passenger_car:
    name: 家用车
    category: automotive
    volume: 8
    base_price: 4200
    price_range: [2200, 9500]
    chain: downstream
  luxury:
    name: 奢侈品
    category: consumer_luxury
    volume: 2
    base_price: 8500
    price_range: [4200, 18000]
    chain: downstream

vehicles:
  van:
    name: 小货车
    capacity_bonus: 18
    speed_bonus: 1
    cost: 7500
  truck:
    name: 大卡车
    capacity_bonus: 42
    speed_bonus: 2
    cost: 22000

event_types:
  - { type: harvest_bumper, name: 丰收, desc: 南通等农业节点产出激增，粮价承压, target_products: [grain, produce], impact_range: [0.15, 0.30] }
  - { type: factory_rush, name: 工厂满产, desc: 苏州等制造城日用品与原材料供给上升, target_products: [daily_goods, raw_materials], impact_range: [0.12, 0.28] }
  - { type: energy_supply, name: 能源宽松, desc: 常州/南通能源供给增加，能源价格承压, target_products: [energy], impact_range: [0.12, 0.28] }
  - { type: auto_fair, name: 车展季, desc: 家用车需求上升, target_products: [passenger_car], impact_range: [0.18, 0.35] }
  - { type: tech_launch, name: 新品发布, desc: 家电需求曲线右移, target_products: [appliances], impact_range: [0.18, 0.35] }
  - { type: luxury_fair, name: 高端展会, desc: 上海等消费枢纽奢侈品需求上升, target_products: [luxury], impact_range: [0.20, 0.40] }
  - { type: logistics_jam, name: 物流拥堵, desc: 本 tick 全图移动时间 +1, global: true, impact_range: [1, 1] }
  - { type: cold_chain_break, name: 冷链中断, desc: 生鲜消费与产出波动加剧, target_products: [produce], impact_range: [-0.25, 0.25] }

rewards:
  official:
    participate: 100
    top50_bonus: 100
    top20_bonus: 200
    first_place_bonus: 500
  practice:
    participate: 40
    top50_bonus: 30
    top20_bonus: 60
    first_place_bonus: 120
