# CyberCore 赛制包 — FStrading（即时物流商战 · 唯一 trading 配置）
id: fstrading
engine: trading
design_mode: standalone
version: "3.3.0"
meta:
  name: FStrading
  description: 4 秒一日即时商战；长三角六城；16 品类；城市参数来自 content/world/yangtze_6，FST 配置覆盖区位差异
  theme: fstrading
  world_region_id: yangtze_6
  world_pack_version: "0.1.2"
  education_focus:
    - 地域产业结构与供需结构
    - 运输时间的机会成本
    - 仓储约束与运力投资
    - 买卖价差与市场池吸收

defaults:
  mode: rts
  tick_interval_sec: 4
  duration_preset: standard
  duration_presets:
    short:
      label: 快速局
      minutes: 8
      total_ticks: 96
    standard:
      label: 标准局
      minutes: 10
      total_ticks: 120
    long:
      label: 完整局
      minutes: 12
      total_ticks: 144
    classroom:
      label: 课堂局
      minutes: 20
      total_ticks: 240
  warmup_ticks: 6
  initial_capital: 50000
  storage_capacity_base: 99
  max_vehicles_per_player: 3
  practice_ai_count: 7
  ai_levels:
    chaotic:
      name: 混乱型
      description: 高随机、常本地贵买贱卖，市场波动大但威胁较低
    advanced:
      name: 精英型
      description: 跨城 bid/ask 套利、产销地采购、高消费城出货

  ai_strategies:
    chaotic:
      name: 混乱型
      description: 高随机、非理性行为，模拟市场噪音
      behavior:
        type: random
        params:
          irrationality: 0.8
      decision_weights:
        buy: 0.30
        sell: 0.25
        move: 0.25
        hold: 0.20

    advanced:
      name: 套利型
      description: 寻找跨城价差，低买高卖
      behavior:
        type: arbitrage
        params:
          min_spread_ratio: 0.15
          max_inventory_ratio: 0.3
          risk_appetite: 0.7
      decision_weights:
        buy: 0.35
        sell: 0.35
        move: 0.25
        hold: 0.05

    hoarder:
      name: 囤积型
      description: 低价大量买入，等待涨价后抛售
      behavior:
        type: value_hoarding
        params:
          buy_threshold: 0.85
          sell_threshold: 1.35
          target_products: [grain, produce, raw_materials]
          max_single_buy_ratio: 0.25
      decision_weights:
        buy: 0.45
        sell: 0.20
        move: 0.15
        hold: 0.20

    momentum:
      name: 趋势型
      description: 追涨杀跌，跟随价格趋势
      behavior:
        type: momentum
        params:
          trend_window: 3
          momentum_threshold: 0.08
          contrarian: false
      decision_weights:
        buy: 0.35
        sell: 0.30
        move: 0.15
        hold: 0.20

    conservative:
      name: 保守型
      description: 稳健经营，避免大风险
      behavior:
        type: conservative
        params:
          max_single_trade_ratio: 0.1
          cash_reserve_ratio: 0.5
          min_profit_margin: 0.2
      decision_weights:
        buy: 0.20
        sell: 0.25
        move: 0.15
        hold: 0.40

  pricing:
    mode: supply_demand_v3
    min_spread: 0.08
    # 8 人局：价格对“缺货/囤货”更敏感，但城市不会在前 10 tick 快速断供
    elasticity: 0.28
    reference_pool: 400
    absorption_cap_per_tick: 40
    # 自然供需流量缩放（prod-cons）每 tick 只推进一小步，避免 5s tick 把城市池抽干
    natural_flow_scale: 0.20
    # 均值回归：池子偏离 target_pool 时，会缓慢拉回（防长期为 0）
    pool_reversion_rate: 0.03
    # 最低库存（按 target_pool 比例），避免出现“池为 0 但价格几乎不动”的反直觉体验
    min_pool_ratio: 0.12
    target_cover_ticks: 6
    scarcity_elasticity: 0.32
    player_elasticity: 0.18
  logistics:
    min_travel_ticks: 2
    move_cost_per_edge: 800
  distributors:
    enabled: true
    max_per_player: 2
    setup_cost: 6000
    upkeep_per_tick: 120
    price_band_pct: 0.12
    max_daily_volume: 12
  world:
    region_id: yangtze_6
    behavior_pack: default_yrd
  # 地理资源见 content/world/geo/yangtze_6/ · API GET /trading/regions/yangtze_6/geo-pack
  products:
    - grain
    - produce
    - raw_materials
    - energy
    - chemicals
    - medicine
    - furniture
    - textile
    - apparel
    - machinery
    - daily_goods
    - appliances
    - digital_device
    - passenger_car
    - cultural_goods
    - luxury

