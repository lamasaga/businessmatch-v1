    name: 小货车
    capacity_bonus: 18
    speed_bonus: 1
    cost: 7500
  truck:
    name: 大卡车
    capacity_bonus: 42
    speed_bonus: 2
    cost: 22000

event_types:
  - type: harvest_bumper
    name: 丰收
    desc: 农业节点丰收，粮食与生鲜产出增加，城市供给池逐日抬升
    target_cities: [nantong, nanjing]
    target_products: [grain, produce]
    affected_segments: [mass_consumer]
    impact: { production_mult: [1.15, 1.35], demand_mult: [0.98, 1.04] }
    forecast_ticks: [1, 3]
    active_ticks: [4, 8]
    decay_ticks: [2, 4]
  - type: factory_rush
    name: 工厂赶单
    desc: 制造城加班交付，下游商品供给上升，同时推高上游原料和能源需求
    target_cities: [suzhou, changzhou]
    target_products: [textile, apparel, appliances, machinery, raw_materials, energy]
    affected_segments: [industrial]
    impact: { production_mult: [1.10, 1.25], demand_mult: [1.06, 1.18] }
    forecast_ticks: [1, 2]
    active_ticks: [5, 9]
    decay_ticks: [2, 4]
  - type: energy_squeeze
    name: 能源偏紧
    desc: 工业用能紧张，能源需求上移，并压低高耗能商品产出
    target_cities: [suzhou, changzhou, nanjing]
    target_products: [energy, chemicals, machinery]
    affected_segments: [industrial]
    impact: { production_mult: [0.88, 0.96], demand_mult: [1.12, 1.30] }
    forecast_ticks: [1, 3]
    active_ticks: [4, 7]
    decay_ticks: [2, 3]
  - type: auto_fair
    name: 车展季
    desc: 中高收入居民购车意愿提升，家用车和数码产品需求同步上涨
    target_cities: [shanghai, hangzhou, nanjing]
    target_products: [passenger_car, digital_device]
    affected_segments: [middle_class, affluent]
    impact: { demand_mult: [1.18, 1.38] }
    forecast_ticks: [2, 4]
    active_ticks: [5, 10]
    decay_ticks: [2, 5]
  - type: tech_launch
    name: 新品发布
    desc: 科技消费升温，数码产品和家电需求曲线右移
    target_cities: [hangzhou, shanghai]
    target_products: [digital_device, appliances]
    affected_segments: [middle_class, affluent]
    impact: { demand_mult: [1.18, 1.36] }
    forecast_ticks: [1, 3]
    active_ticks: [4, 8]
    decay_ticks: [2, 4]
  - type: medicine_alert
    name: 健康提醒
    desc: 居民健康消费短期上升，医药需求增加，但不直接跳价
    target_cities: [shanghai, nanjing, hangzhou]
    target_products: [medicine]
    affected_segments: [mass_consumer, middle_class]
    impact: { demand_mult: [1.16, 1.32] }
    forecast_ticks: [1, 2]
    active_ticks: [3, 6]
    decay_ticks: [2, 3]
  - type: culture_festival
    name: 文旅节
    desc: 文创、服装和奢侈消费升温，消费城收购热度上升
    target_cities: [hangzhou, shanghai, nanjing]
    target_products: [cultural_goods, apparel, luxury]
    affected_segments: [middle_class, affluent]
    impact: { demand_mult: [1.12, 1.30] }
    forecast_ticks: [2, 4]
    active_ticks: [5, 9]
    decay_ticks: [2, 4]
  - type: logistics_jam
    name: 物流拥堵
    desc: 热门路线移动时间增加，间接造成到货延迟和短缺加深
    global: true
    affected_segments: [industrial, mass_consumer]
    impact: { travel_ticks_add: [1, 1] }
    forecast_ticks: [1, 2]
    active_ticks: [2, 5]
    decay_ticks: [1, 2]

