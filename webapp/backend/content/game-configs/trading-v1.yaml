# CyberCore 赛制包 — 浮生记式城市倒卖 v1
id: trading-v1
engine: trading
design_mode: standalone
version: "1.1.0"
meta:
  name: 浮生记 · 城市倒卖
  description: 模仿《北京浮生记》的多城低买高卖；物价由全体玩家（练习时为 AI 交易员）买卖行为驱动，理解供需曲线
  theme: fushengji
  education_focus:
    - 需求增加 → 价格上涨
    - 供给增加 → 价格下跌
    - 跨城套利与机会成本

defaults:
  rounds: 10
  initial_capital: 50000
  inventory_limit: 99
  inventory_limit_per_product: 99
  move_cost: 1000
  decision_time: 60
  practice_ai_count: 3
  pricing:
    mode: market
    elasticity: 0.10
    reference_volume: 8
    sell_spread: 0.95
    event_weight: 0.5
  cities:
    - jingcheng
    - hushi
    - shenshi
    - rongcheng
    - bingcheng
    - gangcheng
  products:
    - fruit
    - vegetable
    - daily
    - electronics
    - clothing
    - cosmetics
    - jewelry
    - antique
    - art
    - snack

products:
  fruit: { name: 水果, category: low, base_price: 30, price_range: [12, 85] }
  vegetable: { name: 蔬菜, category: low, base_price: 25, price_range: [10, 70] }
  daily: { name: 日用品, category: low, base_price: 40, price_range: [18, 95] }
  electronics: { name: 电子产品, category: mid, base_price: 600, price_range: [280, 1400] }
  clothing: { name: 服装, category: mid, base_price: 400, price_range: [180, 950] }
  cosmetics: { name: 化妆品, category: mid, base_price: 500, price_range: [220, 1150] }
  jewelry: { name: 珠宝, category: high, base_price: 15000, price_range: [7000, 32000] }
  antique: { name: 古董, category: high, base_price: 20000, price_range: [9000, 42000] }
  art: { name: 艺术品, category: high, base_price: 25000, price_range: [11000, 52000] }
  snack: { name: 零食, category: low, base_price: 20, price_range: [8, 55] }

cities:
  jingcheng: { name: 京城, type: political, description: 政治中心，高档品需求更旺, preferred_products: [jewelry, art, antique] }
  hushi: { name: 沪市, type: finance, description: 金融中心，中档消费品交易活跃, preferred_products: [cosmetics, clothing] }
  shenshi: { name: 深市, type: tech, description: 科技新城，电子产品供给充足, preferred_products: [electronics] }
  rongcheng: { name: 蓉城, type: leisure, description: 休闲之都，食品供给充裕, preferred_products: [fruit, snack, vegetable] }
  bingcheng: { name: 冰城, type: border, description: 边境口岸，南北货物流转枢纽 }
  gangcheng: { name: 港城, type: freeport, description: 自由港，进口品价格偏低, preferred_products: [daily, electronics] }

event_types:
  - { type: demand_surge, name: 消费热潮, desc: 市民抢购该类商品，需求曲线右移, target_category: random, impact_range: [0.12, 0.35] }
  - { type: oversupply, name: 货源过剩, desc: 大量到货，供给增加，价格承压, target_category: random, impact_range: [-0.30, -0.12] }
  - { type: festival, name: 节庆消费, desc: 节日临近，食品与礼品需求上升, target_category: low, impact_range: [0.15, 0.30] }
  - { type: policy, name: 政策调控, desc: 限价或补贴影响市场预期, target_category: mid, impact_range: [-0.20, 0.10] }
  - { type: trend, name: 流行风潮, desc: 某类商品成为社交热点, target_category: random, impact_range: [0.20, 0.45] }
  - { type: quality, name: 质量风波, desc: 消费者信心下降，需求萎缩, target_category: random, impact_range: [-0.35, -0.15] }

rewards:
  official:
    participate: 100
    top50_bonus: 100
    top20_bonus: 200
    first_place_bonus: 500
  practice:
    participate: 40
    top50_bonus: 30
    top20_bonus: 60
    first_place_bonus: 120
