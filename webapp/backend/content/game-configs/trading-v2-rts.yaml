# CyberCore 赛制包 — 浮生记 RTS 即时战略 v2
id: trading-v2-rts
engine: trading
design_mode: standalone
version: "2.1.0"
meta:
  name: 浮生记 · 即时物流商战
  description: 5 秒 tick 同步；城市内生产出/消费；体积仓储与车辆；组织者可选 8/10/12 分钟
  theme: fushengji-rts
  education_focus:
    - 地域产业结构与供需结构
    - 运输时间的机会成本
    - 仓储约束与运力投资
    - 买卖价差与市场池吸收

defaults:
  mode: rts
  tick_interval_sec: 5
  # 比赛时长由组织者选择 duration_preset；未指定时用 standard
  duration_preset: standard
  duration_presets:
    short:
      label: 快速局
      minutes: 8
      total_ticks: 96
    standard:
      label: 标准局
      minutes: 10
      total_ticks: 120
    long:
      label: 完整局
      minutes: 12
      total_ticks: 144
  warmup_ticks: 6
  initial_capital: 50000
  storage_capacity_base: 99
  max_vehicles_per_player: 3
  practice_ai_count: 3
  # 练习局 AI 档位：chaotic=混乱试探，advanced=逐利套利（与 bot 顺序一一对应）
  practice_ai_slots:
    - chaotic
    - advanced
    - advanced
  ai_levels:
    chaotic:
      name: 混乱型
      description: 高随机、常本地贵买贱卖，市场波动大但威胁较低
    advanced:
      name: 精英型
      description: 跨城 bid/ask 套利、产销地采购、高消费城出货

  # 声明式 AI 策略配置（沙盒可调）
  ai_strategies:
    chaotic:
      name: 混乱型
      description: 高随机、非理性行为，模拟市场噪音
      behavior:
        type: random
        params:
          irrationality: 0.8
      decision_weights:
        buy: 0.30
        sell: 0.25
        move: 0.25
        hold: 0.20

    advanced:
      name: 套利型
      description: 寻找跨城价差，低买高卖
      behavior:
        type: arbitrage
        params:
          min_spread_ratio: 0.15
          max_inventory_ratio: 0.3
          risk_appetite: 0.7
      decision_weights:
        buy: 0.35
        sell: 0.35
        move: 0.25
        hold: 0.05

    hoarder:
      name: 囤积型
      description: 低价大量买入，等待涨价后抛售
      behavior:
        type: value_hoarding
        params:
          buy_threshold: 0.85
          sell_threshold: 1.35
          target_products: [grain, produce, raw_materials]
          max_single_buy_ratio: 0.25
      decision_weights:
        buy: 0.45
        sell: 0.20
        move: 0.15
        hold: 0.20

    momentum:
      name: 趋势型
      description: 追涨杀跌，跟随价格趋势
      behavior:
        type: momentum
        params:
          trend_window: 3
          momentum_threshold: 0.08
          contrarian: false
      decision_weights:
        buy: 0.35
        sell: 0.30
        move: 0.15
        hold: 0.20

    conservative:
      name: 保守型
      description: 稳健经营，避免大风险
      behavior:
        type: conservative
        params:
          max_single_trade_ratio: 0.1
          cash_reserve_ratio: 0.5
          min_profit_margin: 0.2
      decision_weights:
        buy: 0.20
        sell: 0.25
        move: 0.15
        hold: 0.40

  pricing:
    mode: pool_ask_bid
    min_spread: 0.08
    elasticity: 0.12
    reference_pool: 100
    absorption_cap_per_tick: 25
  logistics:
    min_travel_ticks: 2
    move_cost_per_edge: 800
  cities:
    - jingcheng
    - hushi
    - shenshi
    - rongcheng
    - bingcheng
    - gangcheng
  products:
    - grain
    - produce
    - raw_materials
    - energy
    - furniture
    - textile
    - daily_goods
    - appliances
    - passenger_car
    - luxury
  routes:
    # travel_ticks 为无车辆时的基准；实际 = max(min_travel_ticks, base - speed_bonus_sum)
    jingcheng-hushi: { base_travel_ticks: 3 }
    jingcheng-shenshi: { base_travel_ticks: 5 }
    jingcheng-rongcheng: { base_travel_ticks: 6 }
    jingcheng-bingcheng: { base_travel_ticks: 6 }
    jingcheng-gangcheng: { base_travel_ticks: 5 }
    hushi-shenshi: { base_travel_ticks: 4 }
    hushi-gangcheng: { base_travel_ticks: 3 }
    hushi-rongcheng: { base_travel_ticks: 6 }
    hushi-bingcheng: { base_travel_ticks: 6 }
    shenshi-rongcheng: { base_travel_ticks: 5 }
    shenshi-bingcheng: { base_travel_ticks: 4 }
    shenshi-gangcheng: { base_travel_ticks: 4 }
    rongcheng-bingcheng: { base_travel_ticks: 4 }
    rongcheng-gangcheng: { base_travel_ticks: 6 }
    bingcheng-gangcheng: { base_travel_ticks: 5 }

# 体积单位：格（总容量 storage_capacity_base + 车辆加成）
