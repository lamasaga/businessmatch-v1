event_types:
  - { type: harvest_bumper, name: 丰收, desc: 农业城产出激增，粮价承压, target_products: [grain, produce], impact_range: [0.15, 0.30] }
  - { type: factory_rush, name: 工厂满产, desc: 工业城日用品与原材料供给上升, target_products: [daily_goods, raw_materials], impact_range: [0.12, 0.28] }
  - { type: energy_supply, name: 能源宽松, desc: 燃油电力供给增加，能源价格承压, target_products: [energy], impact_range: [0.12, 0.28] }
  - { type: auto_fair, name: 车展季, desc: 家用车需求上升, target_products: [passenger_car], impact_range: [0.18, 0.35] }
  - { type: tech_launch, name: 新品发布, desc: 家电需求曲线右移, target_products: [appliances], impact_range: [0.18, 0.35] }
  - { type: luxury_fair, name: 高端展会, desc: 政治/金融城奢侈品需求上升, target_products: [luxury], impact_range: [0.20, 0.40] }
  - { type: logistics_jam, name: 物流拥堵, desc: 本 tick 全图移动时间 +1, global: true, impact_range: [1, 1] }
  - { type: cold_chain_break, name: 冷链中断, desc: 生鲜消费与产出波动加剧, target_products: [produce], impact_range: [-0.25, 0.25] }

