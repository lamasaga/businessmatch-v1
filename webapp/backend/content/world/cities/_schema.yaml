# 城市母本字段约定（L2 + L3）
# 运行时由 world_loader 转为 GameConfigDocument.cities 条目
#
# 必填：
#   city_id, display_name, name（可与 display_name 相同）
#   production, consumption — RTS pool 定价
# 推荐：
#   type, description, population, demographics, demand_profile, logistics
#   pop_segments[] — POP 引擎（L3）
#   meta.data_sources, meta.calibrated_at, meta.confidence
#
# city_id 规则：小写英文 snake，与 regions/*.yaml cities 列表一致
