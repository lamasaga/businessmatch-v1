openapi: 3.1.0
info:
  title: BizSim Edu API
  description: 商域 - 商业模拟教育平台后端 API
  version: 1.0.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - 认证
      summary: Register
      description: 用户注册
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_AuthResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - 认证
      summary: Login
      description: 用户登录（JSON格式）——支持邮箱或用户名登录
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_AuthResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - 认证
      summary: Get Me
      description: 获取当前登录用户信息
      operationId: get_me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_UserResponse_'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/auth/refresh:
    post:
      tags:
      - 认证
      summary: Refresh Token
      description: 刷新访问Token
      operationId: refresh_token_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_dict_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/wiki/articles:
    get:
      tags:
      - 知识图谱
      summary: Get Articles
      description: 获取知识卡片列表，支持学科、分类和搜索筛选
      operationId: get_articles_api_v1_wiki_articles_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: discipline
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 学科筛选：经济学/商学/管理学
          title: Discipline
        description: 学科筛选：经济学/商学/管理学
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 分类筛选
          title: Category
        description: 分类筛选
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 搜索关键词
          title: Search
        description: 搜索关键词
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_list_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/wiki/articles/{article_id}:
    get:
      tags:
      - 知识图谱
      summary: Get Article
      description: 获取单张知识卡片详情
      operationId: get_article_api_v1_wiki_articles__article_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: article_id
        in: path
        required: true
        schema:
          type: string
          title: Article Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_dict_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/wiki/graph:
    get:
      tags:
      - 知识图谱
      summary: Get Graph
      description: 获取完整知识关联图谱数据（节点+边）
      operationId: get_graph_api_v1_wiki_graph_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_dict_'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/wiki/disciplines:
    get:
      tags:
      - 知识图谱
      summary: Get Disciplines
      description: 获取学科与分类结构
      operationId: get_disciplines_api_v1_wiki_disciplines_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_dict_'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/courses:
    get:
      tags:
      - 课程
      summary: Get Courses
      description: 获取课程列表，支持分类、等级和搜索筛选
      operationId: get_courses_api_v1_courses_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 课程分类
          title: Category
        description: 课程分类
      - name: level
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 难度等级
          title: Level
        description: 难度等级
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 搜索关键词
          title: Search
        description: 搜索关键词
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_list_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/courses/{course_id}:
    get:
      tags:
      - 课程
      summary: Get Course
      description: 获取单个课程详情
      operationId: get_course_api_v1_courses__course_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          title: Course Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_dict_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/opc/companies:
    get:
      tags:
      - OPC - 一人公司
      summary: List Companies
      description: 获取公司列表（Demo：返回所有，生产应限制当前用户）
      operationId: list_companies_api_v1_opc_companies_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_List_OneCompanyOut__'
    post:
      tags:
      - OPC - 一人公司
      summary: Create Company
      description: 创建公司
      operationId: create_company_api_v1_opc_companies_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneCompanyCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_OneCompanyOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/opc/companies/{company_id}:
    get:
      tags:
      - OPC - 一人公司
      summary: Get Company
      description: 获取公司详情（含员工和任务）
      operationId: get_company_api_v1_opc_companies__company_id__get
      parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: integer
          title: Company Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_CompanyDetailOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - OPC - 一人公司
      summary: Update Company
      operationId: update_company_api_v1_opc_companies__company_id__patch
      parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: integer
          title: Company Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneCompanyUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_OneCompanyOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/opc/companies/{company_id}/employees:
    get:
      tags:
      - OPC - 一人公司
      summary: List Employees
      operationId: list_employees_api_v1_opc_companies__company_id__employees_get
      parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: integer
          title: Company Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_List_AIEmployeeOut__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - OPC - 一人公司
      summary: Hire Employee
      description: 雇佣 AI 员工
      operationId: hire_employee_api_v1_opc_companies__company_id__employees_post
      parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: integer
          title: Company Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIEmployeeCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_AIEmployeeOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/opc/employees/{employee_id}:
    get:
      tags:
      - OPC - 一人公司
      summary: Get Employee
      operationId: get_employee_api_v1_opc_employees__employee_id__get
      parameters:
      - name: employee_id
        in: path
        required: true
        schema:
          type: integer
          title: Employee Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_AIEmployeeOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/opc/companies/{company_id}/tasks:
    get:
      tags:
      - OPC - 一人公司
      summary: List Tasks
      operationId: list_tasks_api_v1_opc_companies__company_id__tasks_get
      parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: integer
          title: Company Id
      - name: status
        in: query
        required: false
        schema:
          type: string
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_List_AITaskOut__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - OPC - 一人公司
      summary: Create Task
      description: 创建任务
      operationId: create_task_api_v1_opc_companies__company_id__tasks_post
      parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: integer
          title: Company Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AITaskCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_AITaskOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/opc/tasks/{task_id}:
    patch:
      tags:
      - OPC - 一人公司
      summary: Update Task
      operationId: update_task_api_v1_opc_tasks__task_id__patch
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: integer
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AITaskUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_AITaskOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organizer/apply:
    post:
      tags:
      - 组织者
      summary: Apply Organizer
      description: 申请成为组织者
      operationId: apply_organizer_api_v1_organizer_apply_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizerProfileCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_OrganizerProfileOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/organizer/profile:
    get:
      tags:
      - 组织者
      summary: Get Profile
      description: 获取组织者档案
      operationId: get_profile_api_v1_organizer_profile_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_OrganizerProfileOut_'
      security:
      - OAuth2PasswordBearer: []
    put:
      tags:
      - 组织者
      summary: Update Profile
      description: 更新组织者信息
      operationId: update_profile_api_v1_organizer_profile_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizerProfileUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_OrganizerProfileOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/organizer/stats:
    get:
      tags:
      - 组织者
      summary: Get Stats
      description: 获取组织者统计数据
      operationId: get_stats_api_v1_organizer_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_OrganizerStats_'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/organizer/events:
    get:
      tags:
      - 组织者
      summary: List My Events
      description: 获取当前组织者主办的比赛列表
      operationId: list_my_events_api_v1_organizer_events_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: status_filter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Filter
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_List_CompetitionEventOut__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organizer/events/{event_id}/control:
    get:
      tags:
      - 组织者
      summary: Get Event Control
      description: 组织者控场面板：赛事状态、回合、排行榜、参赛者（无需本人参赛）
      operationId: get_event_control_api_v1_organizer_events__event_id__control_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
          title: Event Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_OrganizerControlOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/competitions:
    get:
      tags:
      - 比赛
      summary: List Competitions
      description: 获取公开比赛列表（默认仅正式赛）
      operationId: list_competitions_api_v1_competitions_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: match_kind
        in: query
        required: false
        schema:
          type: string
          default: official
          title: Match Kind
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_List_CompetitionEventOut__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - 比赛
      summary: Create Competition
      description: 创建比赛
      operationId: create_competition_api_v1_competitions_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetitionEventCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_CompetitionEventOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/competitions/{event_id}:
    get:
      tags:
      - 比赛
      summary: Get Competition
      description: 获取比赛详情
      operationId: get_competition_api_v1_competitions__event_id__get
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
          title: Event Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_CompetitionEventOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - 比赛
      summary: Update Competition
      description: 更新比赛信息
      operationId: update_competition_api_v1_competitions__event_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
          title: Event Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetitionEventUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_CompetitionEventOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/competitions/join:
    post:
      tags:
      - 比赛
      summary: Join Competition
      description: 通过房间码加入比赛
      operationId: join_competition_api_v1_competitions_join_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinCompetitionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ParticipantOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/competitions/{event_id}/leave:
    post:
      tags:
      - 比赛
      summary: Leave Competition
      description: 退出比赛
      operationId: leave_competition_api_v1_competitions__event_id__leave_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
          title: Event Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_dict_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/competitions/{event_id}/standings:
    get:
      tags:
      - 比赛
      summary: Get Standings
      description: 获取排行榜
      operationId: get_standings_api_v1_competitions__event_id__standings_get
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
          title: Event Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_List_dict__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/competitions/{event_id}/my-status:
    get:
      tags:
      - 比赛
