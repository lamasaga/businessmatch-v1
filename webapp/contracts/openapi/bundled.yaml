components:
  schemas:
    AIEmployeeCreate:
      properties:
        codename:
          type: string
          title: Codename
        name:
          type: string
          title: Name
        avatar_emoji:
          type: string
          title: Avatar Emoji
          default: 🤖
        role_type:
          type: string
          title: Role Type
        level:
          type: integer
          title: Level
          default: 1
        skills:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Skills
          default: []
      type: object
      required:
      - codename
      - name
      - role_type
      title: AIEmployeeCreate
